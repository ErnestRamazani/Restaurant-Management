        const r = await api("/api/admin/data/employees-web", "GET", null, true);
        if (!r.ok) {
          el.innerHTML = "<div class='danger'>HTTP " + r.status + "</div>";
          return;
        }
        const hint = getNavFilter("employees");
        if (hint) sessionStorage.removeItem(NAV_FILTER_KEY + ":employees");

        function initialsFromName(name) {
          const t = String(name || "").trim();
          if (!t) return "?";
          const parts = t.split(/\s+/).filter(Boolean);
          if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
          return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
        }

        async function ensureEmpPhoto(imgEl, pathOrUrl) {
          if (!imgEl || !pathOrUrl || imgEl.dataset.loaded === "1") return;
          imgEl.dataset.loaded = "1";
          try {
            const res = await fetch(pathOrUrl, { headers: { "Authorization": "Bearer " + token } });
            if (!res.ok) return;
            const blob = await res.blob();
            imgEl.src = URL.createObjectURL(blob);
            imgEl.classList.add("is-visible");
          } catch (_) { /* keep initials */ }
        }

        function workScheduleFromShifts(e) {
          const days = [
            ["Monday", pick(e, "mondayShift", "MondayShift")],
            ["Tuesday", pick(e, "tuesdayShift", "TuesdayShift")],
            ["Wednesday", pick(e, "wednesdayShift", "WednesdayShift")],
            ["Thursday", pick(e, "thursdayShift", "ThursdayShift")],
            ["Friday", pick(e, "fridayShift", "FridayShift")],
            ["Saturday", pick(e, "saturdayShift", "SaturdayShift")],
            ["Sunday", pick(e, "sundayShift", "SundayShift")]
          ];
          const parts = [];
          for (const [label, sh] of days) {
            const s = String(sh ?? "").trim();
            if (s && !/^off$/i.test(s)) parts.push(label + " (" + s + ")");
          }
          return parts.length ? parts.join(", ") : "";
        }

        let raw = normalizeAdminEntityItems(r.body).map(e0 => {
          let e = e0;
          if (typeof e === "string") {
            try { e = JSON.parse(e); } catch (_) { return null; }
          }
          if (!e || typeof e !== "object") return null;
          let workScheduleSummary = String(pick(e, "workScheduleSummary", "WorkScheduleSummary") ?? "").trim();
          if (!workScheduleSummary) {
            const built = workScheduleFromShifts(e);
            workScheduleSummary = built || "No schedule assigned.";
          }
          let profilePhotoUrl = String(pick(e, "profilePhotoUrl", "ProfilePhotoUrl") ?? "").trim();
          if (!profilePhotoUrl) {
            const legacyPath = String(pick(e, "profileImagePath", "ProfileImagePath") ?? "").trim();
            const id = pick(e, "id", "Id");
            if (legacyPath && id != null)
              profilePhotoUrl = "/api/admin/data/employees-web/" + id + "/photo";
          }
          let todayClockInText = String(pick(e, "todayClockInText", "TodayClockInText") ?? "").trim();
          if (!todayClockInText) todayClockInText = "Not clocked in";
          let todayClockOutText = String(pick(e, "todayClockOutText", "TodayClockOutText") ?? "").trim();
          if (!todayClockOutText) todayClockOutText = "Not clocked out";
          let attendanceStatus = String(pick(e, "attendanceStatus", "AttendanceStatus") ?? "").trim();
          if (!attendanceStatus) attendanceStatus = "Not active";
          let joinDate = String(pick(e, "joinDate", "JoinDate") ?? "").trim();
          return {
            id: pick(e, "id", "Id"),
            uniqueId: String(pick(e, "uniqueId", "UniqueId") ?? ""),
            name: String(pick(e, "name", "Name") ?? ""),
            role: String(pick(e, "role", "Role") ?? ""),
            notes: String(pick(e, "notes", "Notes") ?? ""),
            employmentStatus: String(pick(e, "employmentStatus", "EmploymentStatus") ?? ""),
            profilePhotoUrl: profilePhotoUrl,
            phoneNumber: String(pick(e, "phoneNumber", "PhoneNumber") ?? ""),
            joinDate: joinDate,
            workScheduleSummary: workScheduleSummary,
            todayClockInText: todayClockInText,
            todayClockOutText: todayClockOutText,
            attendanceStatus: attendanceStatus
          };
        }).filter(Boolean);

        if (hint) {
          const fl = hint.toLowerCase();
          raw = raw.filter(row => {
            const blob = [
              row.name, row.role, row.uniqueId, row.employmentStatus, row.notes, row.phoneNumber
            ].join("\n").toLowerCase();
            return blob.includes(fl);
          });
        }

        el.innerHTML =
          "<div class=\"catalog-page\">" +
          "<header class=\"catalog-header\">" +
          "<div>" +
          "<h1 class=\"catalog-page-title\">" + esc(t("empTitle", "Employee Management")) + "</h1>" +
          "</div>" +
          "<div class=\"catalog-actions\"><span class=\"read-only-pill\">" + esc(t("readOnlyWeb", "Read-only web")) + "</span></div></header>" +
          (hint ? "<p class=\"muted\">" + esc(t("filteredStaff", "Filtered: \"{{hint}}\" · {{count}} staff.", { hint: hint, count: raw.length })) + "</p>" : "") +
          "<input type=\"search\" class=\"catalog-search\" id=\"empAdminSearch\" placeholder=\"" + escAttr(t("empSearch", "Search staff…")) + "\" autocomplete=\"off\">" +
          "<div id=\"empAccList\" class=\"emp-acc-list\"></div>" +

        function statusPillClass(st) {

          if (s === "active") return "emp-pill-status";
          return "emp-pill-status inactive";
        }

              .toLowerCase().includes(needle));

        function applySnapshot(snap) {

          const net = snap.todayNetProfitText ?? snap.TodayNetProfitText ?? "";
          const lbl = snap.selectedPeriodLabel ?? snap.SelectedPeriodLabel ?? "";

          const periodExp = snap.totalExpensesText ?? snap.TotalExpensesText ?? "";

          setMoneyAmountEl(el.querySelector("#moneySumSales"), salesText, "revenue");

          const qs = "type=Daily&start=" + encodeURIComponent(start) + "&end=" + encodeURIComponent(end);

          const blob = await res.blob();
          const u = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = u;
          a.download = "daily-report-" + start + "-to-" + end + ".xlsx";
          a.click();
          URL.revokeObjectURL(u);
        }

        await load();

          "</div>" +
          "<div class=\"reports-feed-title\" id=\"reportsFeedSectionTitle\">" + esc(t("repTabDailyFeed", "Chronological daily feed across all entities")) + "</div>" +
          "<div id=\"reportsContent\"><p class=\"muted\">" + esc(t("loading", "Loading…")) + "</p></div>" +
          "</div>";

        let activeRepTab = "daily";
        let reportListsCache = null;
        const selectedEntityId = {
          employees: null,
          tables: null,
          inventory: null,
          menu: null
        };

        const ENTITY_TABS = ["employees", "tables", "inventory", "menu"];
        const VALID_REP_TABS = ["daily", "orders"].concat(ENTITY_TABS);

        const tabTitles = {
          daily: t("repTabDailyFeed", "Chronological daily feed across all entities"),
          orders: t("repTabOrders", "Order activity in range"),
          employees: t("repTabEmployees", "Employee activity timeline"),
          tables: t("repTabTables", "Table activity timeline"),
          inventory: t("repTabInventory", "Inventory activity timeline"),
          menu: t("repTabMenu", "Menu item activity timeline")
        };

        const exportTypeMap = {
          daily: "Daily",
          orders: "Orders",
          employees: "Employees",
          tables: "Tables",
          inventory: "Inventory",
          menu: "Menu"
        };

        const entityListKeys = {
          employees: ["employees", "Employees"],
          tables: ["tables", "Tables"],
          inventory: ["inventoryItems", "InventoryItems"],
          menu: ["menuItems", "MenuItems"]
        };

        const entityDetailPaths = {
          employees: id => "/api/admin/reports/employee/" + id,
          tables: id => "/api/admin/reports/table/" + id,
          inventory: id => "/api/admin/reports/inventory/" + id,
          menu: id => "/api/admin/reports/menu/" + id
        };

        function isEntityTab(tab) {
          return ENTITY_TABS.includes(tab);
        }

        function normalizeRepTab(tab) {
          return VALID_REP_TABS.includes(tab) ? tab : "daily";
        }

        function getEntityList(tab) {
          if (!reportListsCache) return [];
          const keys = entityListKeys[tab] || [];
          for (const k of keys) {
            const list = reportListsCache[k];
            if (Array.isArray(list)) return list;
          }
          return [];
        }

        function formatEntityOptionLabel(item) {
          const name = item.name ?? item.Name ?? "—";
          const uid = item.uniqueId ?? item.UniqueId ?? "";
          const sub = item.subtitle ?? item.Subtitle ?? "";
          let label = name;
          if (uid) label += " (" + uid + ")";
          if (sub) label += " — " + translateTableStatus(sub);
          return label;
        }

        async function ensureReportLists() {
          if (reportListsCache) return reportListsCache;
          const r = await api("/api/admin/reports/lists", "GET", null, true);
          if (!r.ok) throw new Error(formatApiError(r));
          reportListsCache = r.body || {};
          return reportListsCache;
        }

        function renderEntityPickerHtml(tab) {
          const list = getEntityList(tab);
          const selId = selectedEntityId[tab];
          let html =
            "<div class=\"reports-entity-bar\">" +
            "<div class=\"field\"><label for=\"repEntitySelect\">" + esc(tabTitles[tab] || t("repEntityRecord", "record")) + "</label>" +
            "<select id=\"repEntitySelect\"><option value=\"\">" + esc(t("select", "— Select —")) + "</option>";
          for (const item of list) {
            const id = item.id ?? item.Id;
            if (id == null) continue;
            const selected = String(id) === String(selId) ? " selected" : "";
            html +=
              "<option value=\"" + esc(String(id)) + "\"" + selected + ">" +
              esc(formatEntityOptionLabel(item)) +
              "</option>";
          }
          html += "</select></div></div>";
          return html;
        }

        function wireEntityPicker(host, tab) {
          const sel = host.querySelector("#repEntitySelect");
          if (!sel) return;
          sel.addEventListener("change", () => {
            const v = sel.value;
            selectedEntityId[tab] = v ? Number(v) : null;
            refreshContent();
          });
        }

        function renderEntityMetaHtml(tab, body) {
          const blocks = [];
          if (tab === "employees") {
            const notes = body.employeeNotes ?? body.EmployeeNotes ?? "-";
            const payroll = body.employeePayrollHistory ?? body.EmployeePayrollHistory ?? "-";
            blocks.push({ title: t("repNotes", "Notes"), text: notes });
            blocks.push({ title: t("repPayrollHistory", "Payroll history (USD)"), text: payroll });
          } else if (tab === "tables") {
            const server = body.tableCurrentServer ?? body.TableCurrentServer ?? "-";
            blocks.push({ title: t("repCurrentServer", "Current server"), text: server === "Unassigned" ? t("invActorUnassigned", "Unassigned") : server });
          } else if (tab === "inventory") {
            const notes = body.inventoryNotes ?? body.InventoryNotes ?? "-";
            blocks.push({ title: t("repNotes", "Notes"), text: notes === "-" ? "—" : translateInventoryNotes(notes) });
          } else if (tab === "menu") {
            const ing = body.menuIngredientsSummary ?? body.MenuIngredientsSummary ?? "-";
            blocks.push({ title: t("repIngredients", "Ingredients"), text: ing });
          }
          const visible = blocks.filter(b => b.text && String(b.text).trim() && String(b.text).trim() !== "-");
          if (!visible.length) return "";
          return visible
            .map(
              b =>
                "<div class=\"reports-entity-meta\"><strong>" +
                esc(b.title) +
                "</strong><br>" +
                escDetailLines(b.text) +
                "</div>"
            )
            .join("");
        }

        function detailToTimelineData(tab, body) {
          const days = body.timelineDays ?? body.TimelineDays ?? [];
          let summary = "";
          if (tab === "employees")
            summary = body.employeeSummary ?? body.EmployeeSummary ?? "";
          else if (tab === "tables")
            summary = body.tableSummary ?? body.TableSummary ?? "";
          else if (tab === "inventory")
            summary = body.inventorySummary ?? body.InventorySummary ?? "";
          else if (tab === "menu") summary = body.menuSummary ?? body.MenuSummary ?? "";
          return { summaryText: summary, days };
        }

        function syncScopeSelect() {
          const sel = $("repScopeSelect");
          if (sel) sel.value = activeRepTab;
        }

        function setActiveTabButtons() {
          document.querySelectorAll("[data-rep-tab]").forEach(b => {
            b.classList.toggle("active", b.getAttribute("data-rep-tab") === activeRepTab);
          });
          const title = $("reportsFeedSectionTitle");
          if (title) title.textContent = tabTitles[activeRepTab] || tabTitles.daily;
        }

        function formatEntryMetric(ent) {
          const oc = Number(ent.ordersCount ?? ent.OrdersCount ?? 0) || 0;
          const ic = Number(ent.itemCount ?? ent.ItemCount ?? 0) || 0;
          const uu = Number(ent.unitUsage ?? ent.UnitUsage ?? 0) || 0;
          if (oc > 0) return t(oc === 1 ? "metricOrders_one" : "metricOrders_other", oc === 1 ? "{{count}} order" : "{{count}} orders", { count: oc });
          if (ic > 0) return t(ic === 1 ? "metricItems_one" : "metricItems_other", ic === 1 ? "{{count}} item" : "{{count}} items", { count: ic });
          if (uu > 0) return t("metricUnits", "{{count}} units", { count: uu });
          return "—";
        }

        function escDetailLines(s) {
          return String(s ?? "")
            .split("\n")
            .map(line => esc(translateReportSummary(line)))
            .join("<br>");
        }

        function renderReportDayTableRows(day) {
          const entries = day.entries ?? day.Entries ?? [];
          let rows = "";
          for (const ent of entries) {
            const rawT = ent.eventTime ?? ent.EventTime;
            const d = rawT ? new Date(rawT) : null;
            const timeStr = formatReportTime(d);
            const typRaw = ent.eventType ?? ent.EventType ?? "";
            const typ = translateReportEventType(typRaw);
            const sumRaw = ent.summary ?? ent.Summary ?? "";
            const rel = translateReportRelated(ent.relatedInfo ?? ent.RelatedInfo ?? "");
            const ctx = translateReportContext(ent.entityContext ?? ent.EntityContext ?? "");
            let rowClass = "";
            if (typRaw === "Clock in") rowClass = "reports-row-clock-in";
            else if (typRaw === "Clock out") rowClass = "reports-row-clock-out";
            else if (typRaw === "Absence") rowClass = "reports-row-absence";
            rows += "<tr" + (rowClass ? " class=\"" + rowClass + "\"" : "") + ">";
            rows += "<td class=\"reports-cell-time\">" + esc(timeStr) + "</td>";
            rows += "<td>" + esc(typ) + "</td>";
            rows += "<td class=\"reports-cell-detail\">" + escDetailLines(sumRaw) + "</td>";
            rows += "<td class=\"reports-cell-related\">" + esc(rel);
            if (ctx)
              rows += "<div class=\"reports-cell-sub\">" + esc(ctx) + "</div>";
            rows += "</td>";
            rows += "<td class=\"reports-cell-metric\">" + esc(formatEntryMetric(ent)) + "</td>";
            rows += "</tr>";
          }
          return rows;
        }

        function renderReportTimeline(data, opts) {
          opts = opts || {};
          const useDayDropdown = opts.useDayDropdown === true;
          const summary = data.summaryText ?? data.SummaryText ?? "";
          const days = data.days ?? data.Days ?? [];
          if (!days.length) {
            const emptyMsg =
              opts.emptyMessage ??
              opts.EmptyMessage ??
              t("repNoEvents", "No events in this range.");
            return "<p class=\"reports-placeholder\">" + esc(emptyMsg) + "</p>";
          }

          let html = "";

          if (useDayDropdown) {
            html += "<div class=\"reports-day-picker field\"><label for=\"repDayPicker\">" + esc(t("day", "Day")) + "</label>";
            html += "<select id=\"repDayPicker\" class=\"reports-day-select\">";
            days.forEach((day, idx) => {
              const dayText = translateReportDayText(day.dayText ?? day.DayText ?? ("Day " + (idx + 1)));
              const totals = translateReportTotalsText(day.totalsText ?? day.TotalsText ?? "");
              html += "<option value=\"" + idx + "\">" + esc(dayText + " — " + totals) + "</option>";
            });
            html += "</select></div>";

            days.forEach((day, idx) => {
              const dayText = translateReportDayText(day.dayText ?? day.DayText ?? "");
              const totals = translateReportTotalsText(day.totalsText ?? day.TotalsText ?? "");
              const hiddenAttr = idx === 0 ? "" : " hidden";
              html += "<div class=\"reports-day-panel reports-day-block\"" + hiddenAttr + " data-day-index=\"" + idx + "\">";
              html += "<div class=\"reports-day-inline-head\">";
              html += "<span class=\"reports-day-title\">" + esc(dayText) + "</span>";
              html += "<span class=\"reports-day-meta\">" + esc(totals) + "</span></div>";
              html += "<div class=\"reports-table-wrap\"><table class=\"reports-table\">";
              html += "<thead><tr><th>" + esc(t("repColTime", "Time")) + "</th><th>" + esc(t("repColCategory", "Category")) + "</th><th>" + esc(t("repColDetails", "Details")) + "</th><th>" + esc(t("repColRelated", "Related")) + "</th><th>" + esc(t("repColSummary", "Summary")) + "</th></tr></thead><tbody>";
              html += renderReportDayTableRows(day);
              html += "</tbody></table></div></div>";
            });
            return html;
          }

          for (const day of days) {
            const dayText = translateReportDayText(day.dayText ?? day.DayText ?? "");
            const totals = translateReportTotalsText(day.totalsText ?? day.TotalsText ?? "");
            html += "<div class=\"reports-day-block\">";
            html += "<div class=\"reports-day-head\"><span class=\"reports-day-title\">" + esc(dayText) + "</span>";
            html += "<span class=\"reports-day-meta\">" + esc(totals) + "</span></div>";
            html += "<div class=\"reports-table-wrap\"><table class=\"reports-table\">";
            html += "<thead><tr><th>" + esc(t("repColTime", "Time")) + "</th><th>" + esc(t("repColCategory", "Category")) + "</th><th>" + esc(t("repColDetails", "Details")) + "</th><th>" + esc(t("repColRelated", "Related")) + "</th><th>" + esc(t("repColSummary", "Summary")) + "</th></tr></thead><tbody>";
            html += renderReportDayTableRows(day);
            html += "</tbody></table></div></div>";
          }
          return html;
        }

        function wireReportDayPicker(host) {
          if (!host) return;
          const sel = host.querySelector("#repDayPicker");
          const panels = host.querySelectorAll(".reports-day-panel");
          if (!sel || !panels.length) return;
          function show(idx) {
            const n = Math.max(0, Math.min(panels.length - 1, Number(idx) || 0));
            panels.forEach((p, j) => {
              if (j === n) p.removeAttribute("hidden");
              else p.setAttribute("hidden", "");
            });
            sel.value = String(n);
          }
          sel.addEventListener("change", () => show(sel.value));
          show(sel.value || 0);
        }

        async function refreshEntityTab(content, tab) {
          try {
            await ensureReportLists();
          } catch (ex) {
            content.innerHTML = "<div class='danger'>" + esc(String(ex.message || ex)) + "</div>";
            return;
          }

          const entityId = selectedEntityId[tab];
          let html = renderEntityPickerHtml(tab);

          if (!entityId) {
            html += "<p class=\"reports-placeholder\">" + esc(t("repSelectEntity", "Select an entity above, then click Refresh.")) + "</p>";
            content.innerHTML = html;
            wireEntityPicker(content, tab);
            return;
          }

          const path = entityDetailPaths[tab](entityId);
          const r = await api(path, "GET", null, true);
          if (!r.ok) {
            content.innerHTML =
              html + "<div class='danger'>" + esc(formatApiError(r)) + "</div>";
            wireEntityPicker(content, tab);
            return;
          }

          const timelineData = detailToTimelineData(tab, r.body || {});
          html += renderEntityMetaHtml(tab, r.body || {});
          const entityEmptyLabel = {
            employees: t("repEntityEmployee", "employee"),
            tables: t("repEntityTable", "table"),
            inventory: t("repEntityInventory", "inventory item"),
            menu: t("repEntityMenu", "menu item")
          }[tab] || t("repEntityRecord", "record");
          html += renderReportTimeline(timelineData, {
            useDayDropdown: true,
            emptyMessage: t("repNoActivity", "No activity recorded for this {{entity}}.", { entity: entityEmptyLabel })
          });
          content.innerHTML = html;
          wireEntityPicker(content, tab);
          wireReportDayPicker(content);
        }

        async function refreshContent() {
          const content = $("reportsContent");
          const qs = buildReportQueryString();

          if (!content) return;
          content.innerHTML = "<p class=\"muted\">" + esc(t("loading", "Loading…")) + "</p>";

          if (activeRepTab === "daily") {
            const r = await api("/api/admin/reports/daily?" + qs, "GET", null, true);
            if (!r.ok) {
              content.innerHTML = "<div class='danger'>" + esc(formatApiError(r)) + "</div>";
              return;
            }
            content.innerHTML = renderReportTimeline(r.body, { useDayDropdown: true });
            wireReportDayPicker(content);
            return;
          }

          if (activeRepTab === "orders") {
            const r = await api("/api/admin/reports/orders?" + qs, "GET", null, true);
            if (!r.ok) {
              content.innerHTML = "<div class='danger'>" + esc(formatApiError(r)) + "</div>";
              return;
            }
            content.innerHTML = renderReportTimeline(r.body, { useDayDropdown: true });
            wireReportDayPicker(content);
            return;
          }

          if (isEntityTab(activeRepTab)) {
            await refreshEntityTab(content, activeRepTab);
            return;
          }

          activeRepTab = "daily";
          syncScopeSelect();
          setActiveTabButtons();
          content.innerHTML = "<p class=\"reports-placeholder\">" + esc(t("repChooseTab", "Choose a report tab above.")) + "</p>";
        }

        async function onTabClick(tab) {
          activeRepTab = normalizeRepTab(tab);
          syncScopeSelect();
          setActiveTabButtons();
          if (isEntityTab(activeRepTab)) {
            try {
              await ensureReportLists();
            } catch (ex) {
              const content = $("reportsContent");
              if (content)
                content.innerHTML =
                  "<div class='danger'>" + esc(String(ex.message || ex)) + "</div>";
              return;
            }
          }
          refreshContent();
        }

        document.querySelectorAll("[data-rep-tab]").forEach(btn => {
          btn.addEventListener("click", () => onTabClick(btn.getAttribute("data-rep-tab") || "daily"));
        });

        $("repScopeSelect").addEventListener("change", () => {
          const v = normalizeRepTab($("repScopeSelect").value || "daily");
          activeRepTab = v;
          setActiveTabButtons();
          refreshContent();
        });

        $("repStart").addEventListener("change", () => refreshContent());
        $("repEnd").addEventListener("change", () => refreshContent());

        $("btnReportsRefresh").addEventListener("click", () => {
          refreshContent();
        });

        $("btnReportsExport").addEventListener("click", async () => {
          const qs = buildReportQueryString();
          const type = exportTypeMap[activeRepTab] || "Daily";
          const res = await fetch(
            "/api/admin/reports/export?type=" + encodeURIComponent(type) + "&" + qs,
            { headers: { Authorization: "Bearer " + token } }
          );
          if (!res.ok) {
            alert(t("exportFailed", "Export failed: {{status}}", { status: res.status }));
            return;
          }
          const blob = await res.blob();
          const u = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = u;
          a.download = type.toLowerCase().replace(/\s+/g, "-") + "-report.xlsx";
          a.click();
          URL.revokeObjectURL(u);
        });

        $("btnReportsBulk").addEventListener("click", async () => {
          const qs = buildReportQueryString();
          const res = await fetch(
            "/api/admin/reports/export?type=" + encodeURIComponent("All Reports") + "&" + qs,
            { headers: { Authorization: "Bearer " + token } }
          );
          if (!res.ok) {
            alert(t("bulkExportFailed", "Bulk export failed: {{status}}", { status: res.status }));
            return;
          }
          const blob = await res.blob();
          const u = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = u;
          a.download = "reports-bulk.xlsx";
          a.click();
          URL.revokeObjectURL(u);
        });

        syncScopeSelect();
        setActiveTabButtons();
        await refreshContent();
      }
    };

    function renderJsonTable(el, title, res, cols, filterHint) {
      if (!res.ok) {
        el.innerHTML = "<div class='danger'>HTTP " + res.status + "</div>";
        return;
      }
      let items = normalizeAdminEntityItems(res.body);
      if (filterHint) {
        const fl = filterHint.toLowerCase();
        items = items.filter(row => cols.some(c => {
          let v = row[c] ?? row[c.charAt(0).toUpperCase() + c.slice(1)];
          return v != null && String(v).toLowerCase().includes(fl);
        }));
      }
      el.innerHTML = "<div class=\"panel\"><h2>" + esc(title) + "</h2>" +
        (filterHint ? "<p class=\"muted\">" + esc(t("filtered", "Filtered: \"{{hint}}\" · {{count}} row(s).", { hint: filterHint, count: items.length })) + "</p>" : "") +
        "<table class=\"data\"><thead><tr>" +
        cols.map(c => "<th>" + esc(c) + "</th>").join("") + "</tr></thead><tbody>" +
        items.map(row => "<tr>" + cols.map(c => {
          let v = row[c] ?? row[c.charAt(0).toUpperCase() + c.slice(1)];
          if (v && typeof v === "object") v = JSON.stringify(v);
          return "<td>" + esc(v) + "</td>";
        }).join("") + "</tr>").join("") + "</tbody></table></div>";
    }

    function buildReportQueryString() {
      const sEl = document.getElementById("repStart");
      const eEl = document.getElementById("repEnd");
      const s = (sEl && sEl.value) || "";
      const e = (eEl && eEl.value) || "";
      return "start=" + encodeURIComponent(s) + "&end=" + encodeURIComponent(e);
    }

    async function navTo(name, opts) {
      opts = opts || {};
      currentView = name || currentView;
      if (opts.filter && name) setNavFilter(name, opts.filter);
      document.querySelectorAll(".nav-btn").forEach(b => b.classList.toggle("active", b.getAttribute("data-view") === name));
      const el = $("main");
      let mainExtras = "";
      if (name === "orders") mainExtras += " main--orders";
      if (name === "money") mainExtras += " main--money";
      if (name === "reports") mainExtras += " main--reports";
      el.className = "main-area" + mainExtras;
      el.innerHTML = "<p class=\"muted\">" + esc(t("loading", "Loading…")) + "</p>";
      clearDashClock();
      const fn = views[name];
      if (fn) await fn(el);
    }

    document.querySelectorAll(".nav-btn").forEach(btn => {
      btn.addEventListener("click", () => navTo(btn.getAttribute("data-view")));
    });

    $("adminLoginForm").addEventListener("submit", doLogin);
    $("btnLogout").addEventListener("click", showLogin);

    (async function initAdminPortal() {
      if (window.EliteI18n) {
        await EliteI18n.init();
        applyAdminStaticI18n();
        EliteI18n.mountSwitcher("#adminLangLogin");
        EliteI18n.mountSwitcher("#adminLangSidebar");
      }
      if (token) {
        showApp();
        api("/api/admin/dashboard", "GET", null, true).then(async r => {
          if (r.ok) {
            $("sessionLabel").innerHTML = "<span class=\"muted\">" + esc(t("signedIn", "Signed in")) + "</span>";
            await loadPortalBranding();
            navTo("dashboard");
          } else showLogin();
        });
      } else {
        applyAdminStaticI18n();
      }
    })();
  </script>
</body>
</html>
