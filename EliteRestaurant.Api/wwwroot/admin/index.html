<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elite Admin — Read-only</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0f172a;
      --navy-deep: #0b1220;
      --cream: #f7f5f0;
      --amber: #f59e0b;
      --amber-dim: #d97706;
      --gold-line: #c4a035;
      --text-dark: #1f2937;
      --text-muted: #94a3b8;
      --dash-text: #e8eef4;
      --dash-muted: #94a3b8;
      --dash-card: #151f32;
      --dash-border: #2d3b50;
      --radius: 14px;
      --chart-blue: #3b82f6;
      --accent-blue: #3b82f6;
      --accent-gold: #e8b84a;
      --accent-red: #f87171;
      --accent-cyan: #22d3ee;
      --accent-green: #4ade80;
      --accent-purple: #a78bfa;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Plus Jakarta Sans", system-ui, sans-serif; background: var(--navy-deep); color: var(--dash-text); }
    .layout { display: grid; grid-template-columns: 220px 1fr; grid-template-rows: 1fr; min-height: 100vh; }
    .sidebar { border-right: 1px solid var(--dash-border); padding: 14px; display: flex; flex-direction: column; gap: 6px; background: var(--navy); }
    .brand { font-weight: 700; font-size: 15px; letter-spacing: 0.04em; color: var(--amber); }
    .brand-sub { font-size: 11px; color: var(--text-muted); line-height: 1.4; margin-top: 6px; margin-bottom: 8px; }
    .nav-btn {
      width: 100%; text-align: left; padding: 10px 12px; min-height: 42px;
      border: none; border-radius: var(--radius); border-left: 3px solid transparent;
      background: transparent; color: #6b7280; cursor: pointer; font-family: inherit; font-size: 13px;
    }
    .nav-btn:hover { color: #d1d5db; background: rgba(255,255,255,0.04); }
    .nav-btn.active { border-left-color: var(--amber); background: rgba(245,158,11,0.1); color: #fff; font-weight: 600; }
    .who { margin-top: auto; border-top: 1px solid var(--dash-border); padding-top: 12px; font-size: 12px; color: var(--dash-muted); }
    #app > .main-area {
      padding: 20px;
      background: linear-gradient(165deg, var(--navy-deep) 0%, #0f1628 100%);
      color: var(--dash-text);
      min-width: 0;
      min-height: 0;
      align-self: stretch;
      display: flex;
      flex-direction: column;
      overflow: auto;
    }
    #app > .main-area.main--orders { overflow: hidden; }
    #loginWrap.main-area { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--navy); }
    .card { max-width: 420px; width: 100%; border: 1px solid var(--dash-border); border-radius: var(--radius); background: var(--dash-card); padding: 22px; color: var(--dash-text); }
    #loginWrap h1 { margin: 0 0 8px; font-size: 1.3rem; }
    .lead { color: var(--dash-muted); font-size: 14px; margin: 0 0 16px; }
    label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: #64748b; margin-bottom: 6px; }
    input, select {
      width: 100%; min-height: 42px; padding: 0 12px; border: 1px solid var(--dash-border); border-radius: var(--radius);
      font-family: inherit; font-size: 15px; margin-bottom: 12px; background: #0f1928; color: var(--dash-text);
    }
    .btn { min-height: 42px; padding: 0 14px; border-radius: var(--radius); font-family: inherit; font-weight: 600; font-size: 14px; cursor: pointer; border: none; }
    .btn-sm { min-height: 36px; padding: 0 12px; font-size: 13px; }
    .btn-primary { background: var(--amber); color: #111827; }
    .btn-ghost { background: rgba(255,255,255,0.06); color: var(--dash-text); border: 1px solid var(--dash-border); }
    .btn-block { width: 100%; }
    .hidden { display: none !important; }
    .muted { color: var(--dash-muted); font-size: 12px; }
    .danger { color: #fecaca; background: rgba(220,38,38,0.2); padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
    .api-err-detail { white-space: pre-wrap; font-size: 11px; margin: 10px 0 0; color: #fecaca; font-family: ui-monospace, monospace; max-height: 280px; overflow: auto; }
    .panel {
      background: var(--dash-card);
      border: 1px solid var(--dash-border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
    }
    .panel h2 { margin: 0 0 10px; font-size: 1.05rem; font-weight: 600; }
    pre.raw { margin: 0; font-size: 11px; overflow: auto; max-height: 62vh; white-space: pre-wrap; word-break: break-word; color: var(--dash-muted); }
    table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.data th, table.data td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--dash-border); }
    table.data th { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dash-muted); }
    table.data tr:hover td { background: rgba(255,255,255,0.03); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin-bottom: 12px; }
    .toolbar label { margin: 0; }
    .toolbar input { margin: 0; max-width: 160px; }

    /* General Reports */
    #app > .main-area.main--reports { overflow: auto; }
    .reports-hero {
      display: flex; flex-wrap: wrap; justify-content: space-between; gap: 20px; margin-bottom: 8px;
      align-items: flex-start;
    }
    .reports-hero-text h1 { margin: 0; font-size: 1.65rem; font-weight: 700; color: #fff; letter-spacing: -0.02em; }
    .reports-hero-sub {
      margin: 8px 0 0; color: var(--dash-muted); font-size: 13px; max-width: 560px; line-height: 1.5;
    }
    .reports-controls {
      display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end;
      justify-content: flex-end;
    }
    .reports-controls .field { display: flex; flex-direction: column; gap: 4px; }
    .reports-controls .field label {
      margin: 0; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: #64748b;
    }
    .reports-controls input[type="date"],
    .reports-controls select { width: 158px; margin: 0; min-height: 40px; }
    .reports-btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .reports-btn-refresh {
      background: var(--accent-gold) !important; color: #111827 !important; border: none !important;
      font-weight: 700;
    }
    .reports-btn-refresh:hover { filter: brightness(1.05); }
    .reports-tabs {
      display: flex; flex-wrap: wrap; gap: 6px; margin: 18px 0 14px;
    }
    .reports-tab {
      padding: 10px 16px;
      border: 1px solid var(--dash-border);
      border-radius: 10px;
      background: #0f1928;
      color: var(--dash-muted);
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 500;
    }
    .reports-tab:hover { color: var(--dash-text); border-color: #4b5f80; }
    .reports-tab.active {
      background: #f1f5f9;
      color: #0f172a;
      border-color: #f1f5f9;
      font-weight: 700;
    }
    .reports-feed-title {
      color: var(--accent-gold); font-size: 13px; font-weight: 600; margin: 0 0 8px;
    }
    .reports-feed-summary { font-size: 13px; color: var(--dash-muted); margin: 0 0 16px; line-height: 1.55; }
    .reports-day-block {
      border: 1px solid var(--dash-border); border-radius: var(--radius); margin-bottom: 16px;
      overflow: hidden; background: var(--dash-card);
    }
    .reports-day-head {
      padding: 12px 16px; background: rgba(0, 0, 0, 0.22); border-bottom: 1px solid var(--dash-border);
      display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: baseline;
    }
    .reports-day-title { font-weight: 600; color: var(--dash-text); }
    .reports-day-meta { font-size: 12px; color: var(--accent-gold); font-weight: 500; }
    .reports-day-picker { margin: 0 0 16px; max-width: min(520px, 100%); }
    .reports-day-picker label { margin-bottom: 6px; }
    .reports-day-select { width: 100%; margin: 0; min-height: 42px; }
    .reports-day-panel.reports-day-block { margin-bottom: 16px; }
    .reports-day-inline-head {
      padding: 12px 16px; background: rgba(0, 0, 0, 0.22); border-bottom: 1px solid var(--dash-border);
      display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: baseline;
    }
    .reports-table-wrap { overflow: auto; max-height: min(62vh, 640px); }
    .reports-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .reports-table th {
      text-align: left; padding: 10px 12px; font-size: 10px; text-transform: uppercase;
      letter-spacing: 0.07em; color: var(--dash-muted); border-bottom: 1px solid var(--dash-border);
      background: rgba(15, 24, 40, 0.95); position: sticky; top: 0; z-index: 1;
    }
    .reports-table td { padding: 11px 12px; border-bottom: 1px solid var(--dash-border); vertical-align: top; }
    .reports-table tbody tr:hover td { background: rgba(255, 255, 255, 0.035); }
    .reports-cell-time { color: var(--accent-gold); font-weight: 600; white-space: nowrap; }
    .reports-cell-detail { color: var(--dash-text); line-height: 1.45; max-width: min(460px, 36vw); }
    .reports-cell-related { color: var(--dash-muted); font-size: 12px; max-width: min(300px, 28vw); line-height: 1.4; }
    .reports-cell-sub { margin-top: 6px; font-size: 11px; opacity: 0.92; }
    .reports-cell-metric { white-space: nowrap; color: var(--dash-text); }
    .reports-entity-bar {
      display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; margin: 0 0 14px;
      padding: 14px; background: var(--dash-card); border: 1px solid var(--dash-border); border-radius: var(--radius);
    }
    .reports-entity-bar label { margin: 0; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; }
    .reports-entity-bar select { min-width: 260px; margin: 0; }
    .reports-entity-meta {
      white-space: pre-wrap; font-size: 12px; color: var(--dash-muted); margin: 0 0 14px; padding: 14px;
      border-radius: var(--radius); border: 1px solid var(--dash-border); background: rgba(0, 0, 0, 0.18);
      max-height: 180px; overflow: auto; line-height: 1.45;
    }
    .reports-placeholder { color: var(--dash-muted); font-size: 14px; padding: 28px 8px; text-align: center; }

    /* Dashboard */
    .dash-header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 18px; }
    .dash-header h1 { margin: 0; font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; }
    .dash-sub { margin: 6px 0 0; color: var(--dash-muted); font-size: 14px; max-width: 520px; line-height: 1.45; }
    .dash-meta { text-align: right; font-size: 13px; color: var(--dash-muted); }
    .dash-meta .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent-green); margin-right: 6px; vertical-align: middle; }
    .dash-meta .clock { margin-top: 6px; font-weight: 500; color: var(--dash-text); }
    .payroll-banner {
      background: linear-gradient(90deg, rgba(220,38,38,0.25), rgba(180,20,20,0.15));
      border: 1px solid rgba(248,113,113,0.35);
      border-radius: var(--radius);
      padding: 14px 18px;
      margin-bottom: 18px;
      cursor: pointer;
      text-align: left;
      width: 100%;
      font: inherit;
      color: inherit;
      transition: transform 0.12s ease, background 0.12s;
    }
    .payroll-banner:hover { transform: scale(1.002); background: linear-gradient(90deg, rgba(220,38,38,0.32), rgba(180,20,20,0.22)); }
    .payroll-banner strong { display: block; font-size: 15px; margin-bottom: 6px; color: #fecaca; }
    .payroll-banner span { color: var(--dash-muted); font-size: 13px; line-height: 1.4; }

    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .kpi-card {
      background: var(--dash-card);
      border: 1px solid var(--dash-border);
      border-radius: var(--radius);
      padding: 14px 14px 12px;
      cursor: pointer;
      text-align: left;
      width: 100%;
      font: inherit;
      color: inherit;
      transition: background 0.15s, border-color 0.15s, transform 0.12s;
      position: relative;
      overflow: hidden;
    }
    .kpi-card::before {
      content: "";
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: var(--kpi-accent, var(--accent-blue));
    }
    .kpi-card:hover { background: #1a273d; border-color: #3d4f6a; transform: translateY(-1px); }
    .kpi-card.accent-blue { --kpi-accent: var(--accent-blue); }
    .kpi-card.accent-gold { --kpi-accent: var(--accent-gold); }
    .kpi-card.accent-red { --kpi-accent: var(--accent-red); }
    .kpi-card.accent-cyan { --kpi-accent: var(--accent-cyan); }
    .kpi-card.accent-green { --kpi-accent: var(--accent-green); }
    .kpi-card.tables { --kpi-accent: var(--accent-cyan); }
    .kpi-primary { font-size: 1.45rem; font-weight: 700; margin: 8px 0 6px; }
    .kpi-sub { font-size: 12px; color: var(--dash-muted); line-height: 1.35; margin-bottom: 8px; }
    .kpi-sub-em { color: var(--kpi-accent, var(--accent-blue)); font-weight: 500; }
    .kpi-spark-wrap { margin-top: 6px; }
    .kpi-spark-cap { font-size: 10px; color: var(--dash-muted); margin-top: 4px; }
    .kpi-spark { height: 28px; width: 100%; opacity: 0.85; display: block; }
    .kpi-progress { height: 8px; border-radius: 4px; background: #2d3b50; margin: 10px 0 4px; overflow: hidden; }
    .kpi-progress > i { display: block; height: 100%; background: var(--kpi-accent, var(--accent-cyan)); border-radius: 4px; }

    .dash-mid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 14px; margin-bottom: 18px; }
    @media (max-width: 960px) { .dash-mid { grid-template-columns: 1fr; } }
    .panel-title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .panel-title-row h2 { margin: 0; }
    .pill-btn {
      font-size: 11px; padding: 6px 12px; border-radius: 999px;
      border: 1px solid var(--dash-border); background: rgba(255,255,255,0.05);
      color: var(--dash-text); cursor: pointer; font-family: inherit;
    }
    .pill-btn:hover { background: rgba(255,255,255,0.1); }
    .critical-label { color: var(--accent-red); font-size: 12px; font-weight: 600; margin-bottom: 10px; }
    .inv-alert {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      width: 100%;
      text-align: left;
      background: rgba(127,29,29,0.25);
      border: 1px solid rgba(248,113,113,0.25);
      border-radius: 10px;
      padding: 10px 12px; margin-bottom: 8px;
      cursor: pointer; font: inherit; color: inherit;
      transition: background 0.12s;
    }
    .inv-alert.reorder {
      background: rgba(180, 140, 40, 0.15);
      border-color: rgba(232, 184, 74, 0.35);
    }
    .inv-alert.reorder:hover { background: rgba(180, 140, 40, 0.25); }
    .inv-alert.info {
      background: rgba(59, 130, 246, 0.1);
      border-color: rgba(59, 130, 246, 0.25);
    }
    .inv-alert.info:hover { background: rgba(59, 130, 246, 0.18); }
    .inv-alert .t { font-weight: 600; display: block; line-height: 1.35; }
    .inv-alert .d { font-size: 12px; color: var(--dash-muted); display: block; line-height: 1.45; margin-top: 0; }

    .chart-caption { font-size: 12px; color: var(--dash-muted); margin-bottom: 8px; }
    .chart-wrap-hourly { width: 100%; margin: 8px 0 4px; }
    .chart-svg-hourly { width: 100%; height: 220px; display: block; }
    .chart-axis-labels { display: flex; justify-content: space-between; font-size: 10px; color: var(--dash-muted); margin-top: 4px; padding: 0 4px; }
    .chart-svg { width: 100%; height: auto; display: block; }
    .chart-hit {
      fill: transparent; cursor: pointer;
    }
    .chart-hit:hover { fill: rgba(59,130,246,0.08); }

    .top-dish {
      display: flex;
      align-items: stretch;
      gap: 12px;
      margin-bottom: 10px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid rgba(45, 59, 80, 0.85);
      background: rgba(15, 25, 40, 0.65);
    }
    .top-dish:hover { background: rgba(21, 31, 50, 0.92); border-color: #4b5f80; }
    .top-dish-photo-wrap {
      width: 56px; height: 56px; flex-shrink: 0; border-radius: 10px; overflow: hidden;
      background: #1a273d; display: flex; align-items: center; justify-content: center;
    }
    .top-dish-photo {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .top-dish-photo-ph { font-size: 10px; text-align: center; padding: 4px; color: var(--dash-muted); line-height: 1.25; }
    .top-dish-text { flex: 1; min-width: 0; }
    .top-dish .row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; gap: 8px; }
    .top-dish .bar { height: 6px; border-radius: 3px; background: #2d3b50; overflow: hidden; }
    .top-dish .bar > i { display: block; height: 100%; background: var(--accent-blue); border-radius: 3px; }

    .roster-section { margin-bottom: 18px; }
    .roster-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
    .roster-head h2 { margin: 0; font-size: 1.1rem; }
    .roster-badge { font-size: 12px; padding: 4px 10px; border-radius: 8px; background: rgba(232,184,74,0.15); color: var(--accent-gold); border: 1px solid rgba(232,184,74,0.35); }
    .roster-sub { font-size: 13px; color: var(--dash-muted); margin-bottom: 12px; }
    .roster-grid { display: flex; flex-wrap: wrap; gap: 10px; }
    .staff-card {
      display: flex; align-items: center; gap: 10px;
      min-width: 160px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--dash-border);
      background: var(--dash-card);
      cursor: pointer;
      font: inherit; color: inherit;
      text-align: left;
      transition: background 0.12s, transform 0.12s;
    }
    .staff-card:hover { background: #1a273d; transform: translateY(-1px); }
    .staff-av { width: 36px; height: 36px; border-radius: 50%; background: #2d3b50; flex-shrink: 0; }
    .staff-name { font-weight: 600; font-size: 13px; }
    .staff-role { font-size: 11px; color: var(--dash-muted); }
    .staff-st { font-size: 11px; color: var(--dash-muted); margin-top: 2px; }
    .dot-off { background: #64748b; }
    .dot-on { background: var(--accent-green); }

    .dash-bottom { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 14px; align-items: start; }
    @media (max-width: 960px) { .dash-bottom { grid-template-columns: 1fr; } }

    .act-list { display: flex; flex-direction: column; gap: 0; max-height: 70vh; overflow: auto; }
    .act-card {
      border: none;
      border-top: 1px solid rgba(196,160,53,0.35);
      background: transparent;
      padding: 12px 4px;
      cursor: pointer;
      text-align: left;
      font: inherit;
      color: inherit;
      width: 100%;
      transition: background 0.12s;
    }
    .act-card:first-child { border-top: none; }
    .act-card:hover { background: rgba(255,255,255,0.04); }
    .act-kind { font-size: 10px; letter-spacing: 0.1em; color: var(--accent-gold); font-weight: 600; margin-bottom: 4px; }
    .act-title { font-weight: 600; font-size: 14px; }
    .act-detail { font-size: 12px; color: var(--dash-muted); margin-top: 6px; white-space: pre-wrap; line-height: 1.4; }

    /* Orders (read-only, two columns) */
    .orders-view-root { flex: 1; display: flex; flex-direction: column; min-height: 0; gap: 14px; }
    .orders-toolbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 12px; flex-shrink: 0; }
    .orders-toolbar h1 { margin: 0; font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; }
    .orders-updated { font-size: 13px; color: var(--dash-muted); }
    .orders-hint { margin: 0; font-size: 13px; color: var(--dash-muted); flex-shrink: 0; }
    .orders-columns {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      min-height: 0;
      align-items: stretch;
    }
    @media (max-width: 960px) { .orders-columns { grid-template-columns: 1fr; } }
    .orders-col {
      background: var(--dash-card);
      border: 1px solid var(--dash-border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .orders-col h2 { margin: 0 0 10px; font-size: 1rem; font-weight: 600; }
    .orders-col .orders-search {
      width: 100%;
      margin-bottom: 10px;
      min-height: 42px;
      padding: 0 12px;
      border: 1px solid var(--dash-border);
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 14px;
      background: #0f1928;
      color: var(--dash-text);
    }
    .orders-day-label {
      display: block;
      font-size: 11px;
      color: var(--dash-muted);
      margin: 0 0 6px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .orders-day-select {
      width: 100%;
      margin-bottom: 10px;
      min-height: 42px;
      padding: 0 12px;
      border: 1px solid var(--dash-border);
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 14px;
      background: #0f1928;
      color: var(--dash-text);
    }

<body>
  <div id="loginWrap" class="main-area">
    <div class="card">
      <h1>Admin (read-only)</h1>
      <p class="lead">Owner / manager web view. Sign in with your <strong>AdminWeb</strong> staff ID and PIN.</p>
      <div id="loginErr" class="danger hidden"></div>
      <label for="staffId">Sign-in ID</label>
      <input id="staffId" type="text" autocomplete="username" placeholder="er4124">
      <label for="pin">PIN</label>
      <input id="pin" type="password" autocomplete="current-password">
      <button type="button" class="btn btn-primary btn-block" id="btnLogin">Sign in</button>
      <p class="muted" style="margin-top:14px;">Uses same API host. JWT is stored in session storage for this tab only.</p>
    </div>
  </div>

  <div id="app" class="layout hidden">
    <aside class="sidebar">
      <div>
        <div class="brand">ELITE ADMIN</div>
        <div class="brand-sub">Read-only mirrors: dashboard, operations snapshot, reports.</div>
      </div>
      <button type="button" class="nav-btn active" data-view="dashboard">Dashboard</button>
      <button type="button" class="nav-btn" data-view="orders">Orders</button>
      <button type="button" class="nav-btn" data-view="inventory">Inventory</button>
      <button type="button" class="nav-btn" data-view="menu">Menu</button>
      <button type="button" class="nav-btn" data-view="tables">Tables</button>
      <button type="button" class="nav-btn" data-view="employees">Employees</button>
      <button type="button" class="nav-btn" data-view="money">Money</button>
      <button type="button" class="nav-btn" data-view="reports">Reports</button>
      <div class="who">
        <div id="sessionLabel"></div>
        <button type="button" class="btn btn-ghost btn-block" id="btnLogout" style="margin-top:10px;">Sign out</button>
      </div>
    </aside>
    <main class="main-area" id="main"></main>
  </div>

  <script>
    const TOKEN_KEY = "eliteAdminWebJwt";
    const NAV_FILTER_KEY = "eliteAdminNavFilter";
    let token = sessionStorage.getItem(TOKEN_KEY) || "";
    let dashClockTimer = null;

    function $(id) { return document.getElementById(id); }

    async function api(path, method, body, useAuth) {
      const headers = {};
      if (body) headers["Content-Type"] = "application/json";
      if (useAuth !== false && token) headers["Authorization"] = "Bearer " + token;
      const res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
      const txt = await res.text();
      let json;
      try { json = JSON.parse(txt); } catch (_) { json = { raw: txt }; }
      return { ok: res.ok, status: res.status, body: json };
    }

    function fmtMoney(n) {
      const x = Number(n);
      if (!Number.isFinite(x)) return "—";
      return "$" + x.toFixed(2);
    }

    function fmtFc(n) {
      const x = Number(n);
      if (!Number.isFinite(x)) return "—";
      return "FC " + Math.round(x).toLocaleString();
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
    }

    function formatApiError(status, body) {
      if (!body || typeof body !== "object") return "";
      const d = body.detail || body.Detail;
      const m = body.message || body.Message;
      const t = body.title || body.Title;
      const line = d || m || t;
      return line ? String(line) : "";
    }

    function localDayKeyFromTs(ts) {
      if (ts == null || ts === "") return "";
      const d = new Date(ts);
      if (Number.isNaN(d.getTime())) return "";
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return y + "-" + m + "-" + day;
    }

    function pastDayLabelForKey(key) {
      if (!key) return "";
      const parts = key.split("-").map(Number);
      if (parts.length !== 3 || parts.some(n => Number.isNaN(n))) return key;
      const dt = new Date(parts[0], parts[1] - 1, parts[2]);
      return dt.toLocaleDateString(undefined, { weekday: "short", year: "numeric", month: "short", day: "numeric" });
    }

    function collectSortedPastDayKeys(rows, getTs) {
      const set = new Set();
      for (const r of rows) {
        const k = localDayKeyFromTs(getTs(r));
        if (k) set.add(k);
      }
      return [...set].sort().reverse();
    }

    function fmtMenuMoney(n) {
      const x = Number(n);
      if (!Number.isFinite(x)) return "$ 0.00";
      return "$ " + x.toFixed(2);
    }

    function absPublicUrl(u) {
      const t = String(u ?? "").trim();
      if (!t) return "";
      if (t.startsWith("http://") || t.startsWith("https://")) return t;
      if (t.startsWith("/")) return location.origin + t;
      return t;
    }

    function normInvRowAdmin(raw) {
      if (!raw || typeof raw !== "object") return null;
      return {
        id: raw.id ?? raw.Id,
        name: String(raw.name ?? raw.Name ?? ""),
        unit: String(raw.unit ?? raw.Unit ?? "")
      };

    /** Unwraps admin entity list payloads (handles string-encoded rows from some JSON pipelines). */
    function normalizeAdminEntityItemRows(rows) {
      const out = [];
      if (!Array.isArray(rows)) return out;
      for (const row of rows) {
        if (row == null) continue;
        if (typeof row === "string") {
          try {
            const o = JSON.parse(row);
            if (o && typeof o === "object") out.push(o);
          } catch (_) { /* skip */ }
          continue;
        }
        if (typeof row === "object") out.push(row);
      }
      return out;
    }

    function normalizeAdminEntityItems(body) {
      if (!body || typeof body !== "object") return [];
      const rawList = body.items ?? body.Items;
      if (rawList == null) return [];
      if (!Array.isArray(rawList)) {
        if (typeof rawList === "string") {
          try {
            const p = JSON.parse(rawList);
            return normalizeAdminEntityItemRows(Array.isArray(p) ? p : []);
          } catch (_) {
            return [];
          }
        }
        return [];
      }
      return normalizeAdminEntityItemRows(rawList);
    }

    function pick(obj, camel, pascal) {

      if (obj[camel] !== undefined && obj[camel] !== null) return obj[camel];
      if (pascal !== undefined && obj[pascal] !== undefined && obj[pascal] !== null) return obj[pascal];

    function renderHourlyChartBlock(d) {
      const hourlyRaw = pick(d, "hourlyRevenueToday", "HourlyRevenueToday");
      let hourly = Array.isArray(hourlyRaw) ? hourlyRaw.map(x => Math.max(0, Number(x) || 0)) : [];
      if (hourly.length !== 24)
        hourly = Array(24).fill(0);
      const maxReported = Number(pick(d, "hourlyRevenueChartMax", "HourlyRevenueChartMax")) || 0;
      const max = Math.max(maxReported, ...hourly, 1);
      const w = 640, h = 200, padL = 40, padR = 14, padT = 14, padB = 30;
      const innerW = w - padL - padR;
      const innerH = h - padT - padB;
      const gx = i => padL + (i / 23) * innerW;
      const gy = v => padT + innerH * (1 - v / max);
      let grid = "";
      for (let g = 0; g <= 4; g++) {
        const y = padT + (g / 4) * innerH;
        grid += "<line x1=\"" + padL + "\" y1=\"" + y.toFixed(1) + "\" x2=\"" + (w - padR) + "\" y2=\"" + y.toFixed(1) + "\" stroke=\"#2d3b50\" stroke-dasharray=\"5 6\" />";
      }
      const pts = hourly.map((v, i) => gx(i).toFixed(1) + "," + gy(v).toFixed(1)).join(" ");
      const xLast = gx(23).toFixed(1);
      const xFirst = gx(0).toFixed(1);
      const yBase = (h - padB).toFixed(1);
      const areaPts = pts + " " + xLast + "," + yBase + " " + xFirst + "," + yBase;
      let hits = "";
      for (let hour = 0; hour < 24; hour++) {
        hits += "<rect class=\"chart-hit\" x=\"" + (gx(hour) - 13) + "\" y=\"" + padT + "\" width=\"26\" height=\"" + innerH + "\" data-hour=\"" + hour + "\" />";
      }
      const labs = [0, 4, 8, 12, 16, 20, 24].map(hr => {
        const x = hr >= 24 ? padL + innerW : gx(hr);
        return "<text x=\"" + x.toFixed(1) + "\" y=\"" + (h - 10) + "\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"11\" font-family=\"system-ui,sans-serif\">" + hr + "h</text>";
      }).join("");
      return (
        "<div class=\"chart-wrap-hourly\">" +
        "<svg class=\"chart-svg-hourly\" viewBox=\"0 0 " + w + " " + h + "\" xmlns=\"http://www.w3.org/2000/svg\">" +
        "<defs><linearGradient id=\"ghourly\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">" +
        "<stop offset=\"0%\" stop-color=\"#3b82f6\" stop-opacity=\"0.4\"/><stop offset=\"100%\" stop-color=\"#3b82f6\" stop-opacity=\"0\"/></linearGradient></defs>" +
        grid +
        "<polygon fill=\"url(#ghourly)\" points=\"" + areaPts + "\" />" +
        "<polyline fill=\"none\" stroke=\"#3b82f6\" stroke-width=\"2.5\" stroke-linejoin=\"round\" points=\"" + pts + "\" />" +
        hits + labs +
        "</svg></div>" +
        "<div class=\"chart-axis-labels\"><span>0h</span><span>6h</span><span>12h</span><span>18h</span><span>24h</span></div>"
      );
    }

    function sparklineSvg(values) {
      if (!values || !values.length) return "";
      const w = 120, h = 28, pad = 2;
      const v = values.map(x => Math.max(0, Number(x) || 0));
      const max = Math.max(...v, 1);
      const pts = v.map((val, i) => {
        const x = pad + (v.length <= 1 ? 0 : (i / (v.length - 1)) * (w - 2 * pad));
        const y = pad + (h - 2 * pad) * (1 - val / max);
        return x.toFixed(1) + "," + y.toFixed(1);
      });
      return "<svg class=\"kpi-spark\" viewBox=\"0 0 " + w + " " + h + "\" preserveAspectRatio=\"none\"><polyline fill=\"none\" stroke=\"#3b82f6\" stroke-width=\"1.5\" points=\"" + pts.join(" ") + "\" /></svg>";
    }

      inventory: async (el) => {
        const r = await api("/api/admin/data/inventory", "GET", null, true);
        if (!r.ok) {
          el.innerHTML = "<div class='danger'>HTTP " + r.status + "</div>";
          return;
        }
        const hint = getNavFilter("inventory");
        if (hint) sessionStorage.removeItem(NAV_FILTER_KEY + ":inventory");

        let raw = normalizeAdminEntityItems(r.body).map(row => ({
          id: pick(row, "id", "Id"),
          name: String(pick(row, "name", "Name") ?? ""),
          uniqueId: String(pick(row, "uniqueId", "UniqueId") ?? ""),
          stockQuantity: Number(pick(row, "stockQuantity", "StockQuantity") ?? 0),
          unit: String(pick(row, "unit", "Unit") ?? ""),
          expirationDate: pick(row, "expirationDate", "ExpirationDate"),
          notes: String(pick(row, "notes", "Notes") ?? "")
        }));

        if (hint) {
          const q = hint.toLowerCase();
          raw = raw.filter(x =>
            (x.name + "\n" + x.uniqueId).toLowerCase().includes(q));
        }

        let sortInv = "exp";

        function expMeta(iso) {
          if (iso == null || iso === "") return { sortKey: 999999, label: "No expiry", pct: 15, ok: true };
          const d = new Date(iso);
          if (Number.isNaN(d.getTime())) return { sortKey: 999998, label: "—", pct: 20, ok: true };
          const today = new Date();
          today.setHours(0, 0, 0, 0);
          const exp = new Date(d);
          exp.setHours(0, 0, 0, 0);
          const days = Math.round((exp - today) / 864e5);
          let label, ok, pct;
          if (days <= 0) { label = "Expired · " + days + " day(s)"; ok = false; pct = 100; }
          else if (days <= 7) { label = "Critical · " + days + " day(s)"; ok = false; pct = 88; }
          else if (days <= 14) { label = "Bad · " + days + " day(s)"; ok = false; pct = 60; }
          else { label = "Good · " + days + " day(s)"; ok = true; pct = Math.min(96, 28 + Math.min(days, 200) / 8); }
          return { sortKey: days, label, days, pct, ok };
        }

        function qtyLabel(qty) {
          if (qty <= 0) return "Out";
          if (qty <= 3) return "Critical";
          if (qty <= 10) return "Low";
          return "Healthy";
        }

        el.innerHTML =
          "<div class=\"catalog-page\">" +
          "<header class=\"catalog-header\">" +
          "<div><h1>Inventory items</h1>" +
          "<p class=\"catalog-sub\">Single food/ingredient records with unique IDs.</p>" +
         (hint ? "<p class=\"muted\" style=\"margin:8px 0 0;\">Filtered from dashboard: \"" + esc(hint) + "\" · " + raw.length + " row(s).</p>" : "") +
          "</div>" +
          "<div class=\"catalog-actions\">" +
          "<button type=\"button\" class=\"pill-btn\" id=\"invSortExp\">By expiration</button>" +
          "<button type=\"button\" class=\"pill-btn\" id=\"invSortQty\">By quantity</button>" +
          "<span class=\"read-only-pill\">Read-only web</span></div></header>" +
          "<input type=\"search\" class=\"catalog-search\" id=\"invSearch\" placeholder=\"Search inventory…\" autocomplete=\"off\">" +
          "<div class=\"catalog-list\" id=\"invCatalogList\"></div></div>" +
          "<div id=\"invDetailModal\" class=\"modal-backdrop hidden\">" +
          "<div class=\"modal-card-admin\">" +
          "<h3 id=\"invDetailTitle\">Item</h3>" +
          "<pre id=\"invDetailBody\"></pre>" +
          "<button type=\"button\" class=\"btn btn-ghost\" id=\"invDetailClose\">Close</button>" +
          "</div></div>";

        function paintInv() {
          const needle = ($("invSearch").value || "").trim().toLowerCase();
          let rows = !needle
            ? raw.slice()
            : raw.filter(x =>
              (x.name + "\n" + x.uniqueId + "\n" + x.unit + "\n" + x.notes).toLowerCase().includes(needle));
          if (sortInv === "exp") {
            rows.sort((a, b) => expMeta(a.expirationDate).sortKey - expMeta(b.expirationDate).sortKey);
          } else {
            rows.sort((a, b) => a.stockQuantity - b.stockQuantity || a.name.localeCompare(b.name, undefined, { sensitivity: "base" }));
          }
          const list = $("invCatalogList");
          if (!rows.length) {
            list.innerHTML = "<p class=\"muted\">No inventory rows match.</p>";
            return;
          }
          list.innerHTML = rows.map(it => {
            const em = expMeta(it.expirationDate);
            let expDateStr = "—";
            if (it.expirationDate) {
              const rawD = it.expirationDate;
              expDateStr = typeof rawD === "string" ? rawD.slice(0, 10) : new Date(rawD).toISOString().slice(0, 10);
            }
            const qLab = qtyLabel(it.stockQuantity);
            return (
              "<article class=\"inv-card\" data-inv-id=\"" + it.id + "\">" +
              "<div class=\"inv-card-top\">" +
              "<div>" +
              "<h2 class=\"inv-name\">" + esc(it.name) + "</h2>" +
              "<div class=\"inv-id\">" + esc(it.uniqueId) + "</div>" +
              "<div class=\"inv-stock\">Stock: " + esc(String(it.stockQuantity)) + " " + esc(it.unit) +
              " · <span class=\"muted\">" + esc(qLab) + "</span></div>" +
              "<div class=\"inv-exp-line\">Expires: " + esc(expDateStr) + "</div>" +
              "</div>" +
              "<div class=\"inv-actions\">" +
              "<button type=\"button\" class=\"btn btn-ghost btn-sm js-inv-detail\">Details</button>" +
              "</div></div>" +
              "<div class=\"inv-status-row\">" +
              "<span class=\"muted\" style=\"font-size:14px;\" aria-hidden=\"true\">⏳</span>" +
              "<div class=\"inv-bar-wrap\"><div class=\"inv-bar " + (em.ok ? "ok" : "bad") + "\" style=\"width:" + em.pct.toFixed(1) + "%\"></div></div>" +
              "<span class=\"muted\" style=\"font-size:13px;\">" + esc(em.label) + "</span>" +
              "</div>" +
              "<div class=\"inv-log\">" + esc(it.notes || "No notes on file. Full stock activity history is in Elite Pro.") + "</div>" +
              "</article>");
          }).join("");

          list.querySelectorAll(".js-inv-detail").forEach(btn => {
            btn.addEventListener("click", e => {
              e.stopPropagation();
              const card = btn.closest(".inv-card");
              const id = Number(card.getAttribute("data-inv-id"));
              const it = raw.find(x => x.id === id);
              if (!it) return;
              const em = expMeta(it.expirationDate);
              $("invDetailTitle").textContent = it.name;
              $("invDetailBody").textContent =
                "ID: " + it.uniqueId + "\nStock: " + it.stockQuantity + " " + it.unit + " (" + qtyLabel(it.stockQuantity) + ")\n" +
                "Expiration: " + (it.expirationDate || "—") + "\nShelf status: " + em.label + "\n\nNotes:\n" + (it.notes || "—");
              $("invDetailModal").classList.remove("hidden");
            });
          });
        }

        $("invSortExp").addEventListener("click", () => { sortInv = "exp"; paintInv(); });
        $("invSortQty").addEventListener("click", () => { sortInv = "qty"; paintInv(); });
        $("invSearch").addEventListener("input", paintInv);
        $("invDetailClose").addEventListener("click", () => $("invDetailModal").classList.add("hidden"));
        $("invDetailModal").addEventListener("click", e => {
          if (e.target.id === "invDetailModal") $("invDetailModal").classList.add("hidden");
        });

        paintInv();
      },

        function normMenuCat(s) {

          return t || "General";
        }

          const id = pick(row, "id", "Id");

          };

        }

        function ingHtmlForProduct(p) {

            const u = x.unit ? " " + x.unit : "";

          "</div>" +
          "<div id=\"menuAdminList\"></div></div>";

        function allCategories() {
          return [...new Set(raw.map(p => p.category))].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" }));
        }
        function subsForCat(catVal) {
          const set = new Set();
          for (const p of raw) {
            if (catVal === "__all__" || p.category === catVal) set.add(p.subCategory);
          }
          return [...set].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" }));

          catSel.innerHTML = "<option value=\"__all__\">All</option>" +
            cats.map(c => "<option value=\"" + esc(c) + "\">" + esc(c) + "</option>").join("");
          catSel.value = (prevC && (prevC === "__all__" || cats.includes(prevC))) ? prevC : "__all__";

          } else if (sortMenu === "priceLo") {

          return out;

            if (!needle) return true;
            return (p.name + "\n" + p.uniqueId + "\n" + p.description + "\n" + p.composition).toLowerCase().includes(needle);

              html += "<div class=\"menu-prod-grid\">";
              for (const p of byCat[c][s]) {
                const imgUrl = p.photoUrl || "";
                const thumb = imgUrl
                  ? ("<img src=\"" + esc(imgUrl) + "\" alt=\"\" loading=\"lazy\" " +
                     "onerror=\"this.remove();var ph=this.parentNode.querySelector('.menu-prod-thumb-ph');if(ph){ph.style.display='flex';}\">" +

                  : "<div class=\"menu-prod-thumb-ph\" aria-hidden=\"true\">🍽</div>";
                html +=
                  "<article class=\"menu-prod-card\">" +
                  "<div class=\"menu-prod-thumb\">" + thumb + "</div>" +
                  "<div class=\"menu-prod-body\">" +
                  "<div class=\"menu-prod-name\">" + esc(p.name) + "</div>" +
                  "<div class=\"menu-prod-id mono\">" + esc(p.uniqueId) + "</div>" +
                  "<div class=\"menu-prod-price\">" + esc(fmtMenuMoney(p.price)) + "</div>" +
                  ingHtmlForProduct(p) +
                  "</div></article>";
              }
              html += "</div>";
            }
          }
          list.innerHTML = html;
        }

        syncSelectors();
        $("menuCatSel").addEventListener("change", () => { syncSelectors(); paintMenu(); });
        $("menuSubSel").addEventListener("change", paintMenu);
        $("menuSortName").addEventListener("click", () => { sortMenu = "name"; paintMenu(); });
        $("menuSortPriceHi").addEventListener("click", () => { sortMenu = "priceHi"; paintMenu(); });
        $("menuSortPriceLo").addEventListener("click", () => { sortMenu = "priceLo"; paintMenu(); });
        $("menuAdminSearch").addEventListener("input", paintMenu);
        paintMenu();
      },

          if (!imgEl || !pathOrUrl || imgEl.dataset.loaded === "1") return;

        function workScheduleFromShifts(e) {
          const days = [
            ["Monday", pick(e, "mondayShift", "MondayShift")],
            ["Tuesday", pick(e, "tuesdayShift", "TuesdayShift")],
            ["Wednesday", pick(e, "wednesdayShift", "WednesdayShift")],
            ["Thursday", pick(e, "thursdayShift", "ThursdayShift")],
            ["Friday", pick(e, "fridayShift", "FridayShift")],
            ["Saturday", pick(e, "saturdayShift", "SaturdayShift")],
            ["Sunday", pick(e, "sundayShift", "SundayShift")]
          ];
          const parts = [];
          for (const [label, sh] of days) {
            const s = String(sh ?? "").trim();

          const m = String(x.getMonth() + 1).padStart(2, "0");

          const hh = String(d.getHours()).padStart(2, "0");
          const mm = String(d.getMinutes()).padStart(2, "0");
          return day + " " + mon + " " + hh + ":" + mm;

        await load();

            rows += "</td>";
            rows += "<td class=\"reports-cell-metric\">" + esc(formatEntryMetric(ent)) + "</td>";
            rows += "</tr>";
          }
          return rows;
        }

        function renderReportTimeline(data, opts) {
          opts = opts || {};
          const useDayDropdown = opts.useDayDropdown === true;
          const summary = data.summaryText ?? data.SummaryText ?? "";
          const days = data.days ?? data.Days ?? [];
          if (!days.length)
            return "<p class=\"reports-placeholder\">No events in this range.</p>";

          let html = "";
          if (summary)
            html += "<p class=\"reports-feed-summary\">" + esc(summary) + "</p>";

          if (useDayDropdown) {
            html += "<div class=\"reports-day-picker field\"><label for=\"repDayPicker\">Day</label>";
            html += "<select id=\"repDayPicker\" class=\"reports-day-select\">";
            days.forEach((day, idx) => {
              const dayText = day.dayText ?? day.DayText ?? ("Day " + (idx + 1));
              const totals = day.totalsText ?? day.TotalsText ?? "";
              html += "<option value=\"" + idx + "\">" + esc(dayText + " — " + totals) + "</option>";
            });
            html += "</select></div>";

            days.forEach((day, idx) => {
              const dayText = day.dayText ?? day.DayText ?? "";
              const totals = day.totalsText ?? day.TotalsText ?? "";
              const hiddenAttr = idx === 0 ? "" : " hidden";
              html += "<div class=\"reports-day-panel reports-day-block\"" + hiddenAttr + " data-day-index=\"" + idx + "\">";
              html += "<div class=\"reports-day-inline-head\">";
              html += "<span class=\"reports-day-title\">" + esc(dayText) + "</span>";
              html += "<span class=\"reports-day-meta\">" + esc(totals) + "</span></div>";
              html += "<div class=\"reports-table-wrap\"><table class=\"reports-table\">";
              html += "<thead><tr><th>Time</th><th>Category</th><th>Details</th><th>Related</th><th>Summary</th></tr></thead><tbody>";
              html += renderReportDayTableRows(day);
              html += "</tbody></table></div></div>";
            });
            return html;
          }

          for (const day of days) {
            const dayText = day.dayText ?? day.DayText ?? "";
            const totals = day.totalsText ?? day.TotalsText ?? "";
            html += "<div class=\"reports-day-block\">";
            html += "<div class=\"reports-day-head\"><span class=\"reports-day-title\">" + esc(dayText) + "</span>";
            html += "<span class=\"reports-day-meta\">" + esc(totals) + "</span></div>";
            html += "<div class=\"reports-table-wrap\"><table class=\"reports-table\">";
            html += "<thead><tr><th>Time</th><th>Category</th><th>Details</th><th>Related</th><th>Summary</th></tr></thead><tbody>";
            html += renderReportDayTableRows(day);
            html += "</tbody></table></div></div>";
          }
          return html;
        }

        function wireReportDayPicker(host) {
          if (!host) return;
          const sel = host.querySelector("#repDayPicker");
          const panels = host.querySelectorAll(".reports-day-panel");
          if (!sel || !panels.length) return;
          function show(idx) {
            const n = Math.max(0, Math.min(panels.length - 1, Number(idx) || 0));
            panels.forEach((p, j) => {
              if (j === n) p.removeAttribute("hidden");
              else p.setAttribute("hidden", "");
            });
            sel.value = String(n);
          }
          sel.addEventListener("change", () => show(sel.value));
          show(sel.value || 0);
        }

        async function refreshContent() {
          const content = $("reportsContent");
          const qs = buildReportQueryString();

          if (!content) return;
          content.innerHTML = "<p class=\"muted\">Loading…</p>";

          if (activeRepTab === "daily") {
            const r = await api("/api/admin/reports/daily?" + qs, "GET", null, true);
            if (!r.ok) {
              content.innerHTML = "<div class='danger'>HTTP " + r.status + "</div>";
              return;
            }
            content.innerHTML = renderReportTimeline(r.body, { useDayDropdown: true });
            wireReportDayPicker(content);
            return;
          }

          if (activeRepTab === "orders") {
            const r = await api("/api/admin/reports/orders?" + qs, "GET", null, true);
            if (!r.ok) {
              content.innerHTML = "<div class='danger'>HTTP " + r.status + "</div>";
              return;
            }
            content.innerHTML = renderReportTimeline(r.body, { useDayDropdown: true });
            wireReportDayPicker(content);
            return;
          }

          activeRepTab = "daily";
          syncScopeSelect();
          setActiveTabButtons();
          content.innerHTML = "<p class=\"reports-placeholder\">Choose Daily or Orders above.</p>";
        }

        function onTabClick(tab) {
          activeRepTab = tab === "orders" ? "orders" : "daily";
          syncScopeSelect();
          setActiveTabButtons();
          refreshContent();
        }

        document.querySelectorAll("[data-rep-tab]").forEach(btn => {
          btn.addEventListener("click", () => onTabClick(btn.getAttribute("data-rep-tab") || "daily"));
        });

        $("repScopeSelect").addEventListener("change", () => {
          const v = $("repScopeSelect").value || "daily";
          activeRepTab = v === "orders" ? "orders" : "daily";
          setActiveTabButtons();
          refreshContent();
        });

        $("repStart").addEventListener("change", () => refreshContent());
        $("repEnd").addEventListener("change", () => refreshContent());

        $("btnReportsRefresh").addEventListener("click", () => {
          refreshContent();
        });

        $("btnReportsExport").addEventListener("click", async () => {
          const qs = buildReportQueryString();
          const type = exportTypeMap[activeRepTab] || "Daily";
          const res = await fetch(
            "/api/admin/reports/export?type=" + encodeURIComponent(type) + "&" + qs,
            { headers: { Authorization: "Bearer " + token } }
          );
          if (!res.ok) {
            alert("Export failed: " + res.status);
            return;
          }
          const blob = await res.blob();
          const u = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = u;
          a.download = type.toLowerCase().replace(/\s+/g, "-") + "-report.xlsx";
          a.click();
          URL.revokeObjectURL(u);
        });

        $("btnReportsBulk").addEventListener("click", async () => {
          const qs = buildReportQueryString();
          const res = await fetch(
            "/api/admin/reports/export?type=" + encodeURIComponent("All Reports") + "&" + qs,
            { headers: { Authorization: "Bearer " + token } }
          );
          if (!res.ok) {
            alert("Bulk export failed: " + res.status);
            return;
          }
          const blob = await res.blob();
          const u = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = u;
          a.download = "reports-bulk.xlsx";
          a.click();
          URL.revokeObjectURL(u);
        });

        syncScopeSelect();
        setActiveTabButtons();
        await refreshContent();
      }
    };

    function renderJsonTable(el, title, res, cols, filterHint) {
      if (!res.ok) {
        el.innerHTML = "<div class='danger'>HTTP " + res.status + "</div>";
        return;
      }
      let items = normalizeAdminEntityItems(res.body);
      if (filterHint) {
        const fl = filterHint.toLowerCase();
        items = items.filter(row => cols.some(c => {
          let v = row[c] ?? row[c.charAt(0).toUpperCase() + c.slice(1)];
          return v != null && String(v).toLowerCase().includes(fl);
        }));
      }
      el.innerHTML = "<div class=\"panel\"><h2>" + esc(title) + "</h2>" +
        (filterHint ? "<p class=\"muted\">Filtered: \"" + esc(filterHint) + "\" · " + items.length + " row(s).</p>" : "") +
        "<table class=\"data\"><thead><tr>" +
        cols.map(c => "<th>" + esc(c) + "</th>").join("") + "</tr></thead><tbody>" +
        items.map(row => "<tr>" + cols.map(c => {
          let v = row[c] ?? row[c.charAt(0).toUpperCase() + c.slice(1)];
          if (v && typeof v === "object") v = JSON.stringify(v);
          return "<td>" + esc(v) + "</td>";
        }).join("") + "</tr>").join("") + "</tbody></table></div>";
    }

    function buildReportQueryString() {
      const sEl = document.getElementById("repStart");
      const eEl = document.getElementById("repEnd");
      const s = (sEl && sEl.value) || "";
      const e = (eEl && eEl.value) || "";
      return "start=" + encodeURIComponent(s) + "&end=" + encodeURIComponent(e);
    }

    async function navTo(name, opts) {
      opts = opts || {};
      if (opts.filter && name) setNavFilter(name, opts.filter);
      document.querySelectorAll(".nav-btn").forEach(b => b.classList.toggle("active", b.getAttribute("data-view") === name));
      const el = $("main");
      let mainExtras = "";
      if (name === "orders") mainExtras += " main--orders";
      if (name === "money") mainExtras += " main--money";
      if (name === "reports") mainExtras += " main--reports";
      el.className = "main-area" + mainExtras;
      el.innerHTML = "<p class=\"muted\">Loading…</p>";
      clearDashClock();
      const fn = views[name];
      if (fn) await fn(el);
    }

    document.querySelectorAll(".nav-btn").forEach(btn => {
      btn.addEventListener("click", () => navTo(btn.getAttribute("data-view")));
    });

    $("btnLogin").addEventListener("click", doLogin);
    $("btnLogout").addEventListener("click", showLogin);

    if (token) {
      showApp();
      api("/api/admin/dashboard", "GET", null, true).then(r => {
        if (r.ok) {
          $("sessionLabel").innerHTML = "<span class=\"muted\">Signed in</span>";
          navTo("dashboard");
        } else showLogin();
      });
    }
  </script>
</body>
</html>
