<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elite Admin — Read-only</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0f172a;
      --navy-deep: #0b1220;
      --cream: #f7f5f0;
      --amber: #f59e0b;
      --amber-dim: #d97706;
      --gold-line: #c4a035;
      --text-dark: #1f2937;
      --text-muted: #94a3b8;
      --dash-text: #e8eef4;
      --dash-muted: #94a3b8;
      --dash-card: #151f32;
      --dash-border: #2d3b50;
      --radius: 14px;
      --radius-sm: 10px;
      --border: rgba(255, 255, 255, 0.08);
      --chart-blue: #3b82f6;
      --accent-blue: #3b82f6;
      --accent-gold: #e8b84a;
      --accent-red: #f87171;
      --accent-cyan: #22d3ee;
      --accent-green: #4ade80;
      --accent-purple: #a78bfa;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Plus Jakarta Sans", system-ui, sans-serif; background: var(--navy-deep); color: var(--dash-text); }
    .layout { display: grid; grid-template-columns: 220px 1fr; grid-template-rows: 1fr; min-height: 100vh; }
    .sidebar { border-right: 1px solid var(--dash-border); padding: 14px; display: flex; flex-direction: column; gap: 6px; background: var(--navy); }
    .brand-wrap { margin-bottom: 6px; display: flex; flex-direction: column; align-items: stretch; }
    .brand-logo {
      width: 100%; height: 72px; max-height: 84px; object-fit: contain; object-position: center center;
      display: block; margin: 0 auto 8px; padding: 8px; box-sizing: border-box;
      border-radius: var(--radius); border: 1px solid var(--dash-border); background: #111c27;
    }
    .brand { font-weight: 700; font-size: 14px; letter-spacing: 0.04em; color: var(--amber); }
    .brand-sub { display: none; }
    .nav-btn {
      width: 100%; text-align: left; padding: 10px 12px; min-height: 42px;
      border: none; border-radius: var(--radius); border-left: 3px solid transparent;
      background: transparent; color: #6b7280; cursor: pointer; font-family: inherit; font-size: 13px;
    }
    .nav-btn:hover { color: #d1d5db; background: rgba(255,255,255,0.04); }
    .nav-btn.active { border-left-color: var(--amber); background: rgba(245,158,11,0.1); color: #fff; font-weight: 600; }
    .who { margin-top: auto; border-top: 1px solid var(--dash-border); padding-top: 12px; font-size: 12px; color: var(--dash-muted); }
    #app > .main-area {
      padding: 20px;
      background: linear-gradient(165deg, var(--navy-deep) 0%, #0f1628 100%);
      color: var(--dash-text);
      min-width: 0;
      min-height: 0;
      align-self: stretch;
      display: flex;
      flex-direction: column;
      overflow: auto;
    }
    #app > .main-area.main--orders { overflow: hidden; }
    .card { max-width: 420px; width: 100%; border: 1px solid var(--dash-border); border-radius: var(--radius); background: var(--dash-card); padding: 22px; color: var(--dash-text); }
    .admin-login-screen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; background: var(--navy);
    }
    .admin-login { max-width: 420px; width: 100%; }
    .admin-login__title { margin: 0 0 12px; font-size: 1.35rem; font-weight: 700; color: #e8eaef; }
    .admin-login__form label { margin-top: 4px; color: var(--dash-muted); letter-spacing: 0.12em; text-transform: none; }
    .admin-login__form input { margin-bottom: 14px; }
    .admin-login__error { margin-bottom: 14px; }
    .admin-login__error:empty { display: none !important; }
    .elite-lang-switch {
      position: absolute; top: 12px; right: 12px;
      padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--panel); color: var(--amber); font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .elite-lang-switch:hover { border-color: var(--amber); }
    .admin-login { position: relative; }
    .admin-lang-wrap { display: flex; justify-content: flex-end; margin-bottom: 10px; }
    #adminLangSidebar.admin-lang-wrap { margin-top: 4px; margin-bottom: 8px; justify-content: flex-start; }
    .lead { color: var(--dash-muted); font-size: 14px; margin: 0 0 16px; }
    label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: #64748b; margin-bottom: 6px; }
    input, select {
      width: 100%; min-height: 42px; padding: 0 12px; border: 1px solid var(--dash-border); border-radius: var(--radius);
      font-family: inherit; font-size: 15px; margin-bottom: 12px; background: #0f1928; color: var(--dash-text);
    }
    .btn { min-height: 42px; padding: 0 14px; border-radius: var(--radius); font-family: inherit; font-weight: 600; font-size: 14px; cursor: pointer; border: none; }
    .btn-sm { min-height: 36px; padding: 0 12px; font-size: 13px; }
    .btn-primary { background: var(--amber); color: #111827; }
    .btn-ghost { background: rgba(255,255,255,0.06); color: var(--dash-text); border: 1px solid var(--dash-border); }
    .btn-block { width: 100%; }
    .hidden { display: none !important; }
    .muted { color: var(--dash-muted); font-size: 12px; }
    .danger { color: #fecaca; background: rgba(220,38,38,0.2); padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
    .api-err-detail { white-space: pre-wrap; font-size: 11px; margin: 10px 0 0; color: #fecaca; font-family: ui-monospace, monospace; max-height: 280px; overflow: auto; }
    .panel {
      background: var(--dash-card);
      border: 1px solid var(--dash-border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
    }
    .panel h2 { margin: 0 0 10px; font-size: 1.05rem; font-weight: 600; }
    pre.raw { margin: 0; font-size: 11px; overflow: auto; max-height: 62vh; white-space: pre-wrap; word-break: break-word; color: var(--dash-muted); }
    table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.data th, table.data td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--dash-border); }
    table.data th { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dash-muted); }
    table.data tr:hover td { background: rgba(255,255,255,0.03); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin-bottom: 12px; }
    .toolbar label { margin: 0; }
    .toolbar input { margin: 0; max-width: 160px; }

    /* General Reports */
    #app > .main-area.main--reports { overflow: hidden; }
    .reports-page {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .reports-hero,
    .reports-tabs,
    .reports-feed-title,
    .reports-feed-summary,
    .reports-day-picker {
      flex-shrink: 0;
    }
    #app > .main-area.main--reports #reportsContent {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    #app > .main-area.main--reports #reportsContent:has(> .reports-day-panel) {
      overflow: hidden;
    }
    #app > .main-area.main--reports #reportsContent > .reports-day-panel:not([hidden]) {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      margin-bottom: 0;
    }
    .reports-hero {
      display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 20px; margin-bottom: 8px;
      align-items: center;
    }
    .reports-hero-text h1 {
      margin: 0; font-size: clamp(1.45rem, 2.4vw, 1.85rem); font-weight: 700; color: #fff; letter-spacing: -0.02em;
    }
    .reports-controls {
      display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end;
      justify-content: flex-end;
    }
    .reports-controls .field { display: flex; flex-direction: column; gap: 4px; }
    .reports-controls .field label {
      margin: 0; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: #64748b;
    }
    .reports-controls input[type="date"],
    .reports-controls select { width: 158px; margin: 0; min-height: 40px; }
    .reports-btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .reports-btn-refresh {
      background: var(--accent-gold) !important; color: #111827 !important; border: none !important;
      font-weight: 700;
    }
    .reports-btn-refresh:hover { filter: brightness(1.05); }
    .reports-tabs {
      display: flex; flex-wrap: wrap; gap: 6px; margin: 18px 0 14px;
    }
    .reports-tab {
      padding: 10px 16px;
      border: 1px solid var(--dash-border);
      border-radius: 10px;
      background: #0f1928;
      color: var(--dash-muted);
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 500;
    }
    .reports-tab:hover { color: var(--dash-text); border-color: #4b5f80; }
    .reports-tab.active {
      background: #f1f5f9;
      color: #0f172a;
      border-color: #f1f5f9;
      font-weight: 700;
    }
    .reports-feed-title {
      color: var(--accent-gold); font-size: 13px; font-weight: 600; margin: 0 0 8px;
    }
    .reports-feed-summary { font-size: 13px; color: var(--dash-muted); margin: 0 0 16px; line-height: 1.55; }
    .reports-day-block {
      border: 1px solid var(--dash-border); border-radius: var(--radius); margin-bottom: 16px;
      overflow: hidden; background: var(--dash-card);
    }
    .reports-day-head {
      padding: 12px 16px; background: rgba(0, 0, 0, 0.22); border-bottom: 1px solid var(--dash-border);
      display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: baseline;
    }
    .reports-day-title { font-weight: 600; color: var(--dash-text); }
    .reports-day-meta { font-size: 12px; color: var(--accent-gold); font-weight: 500; }
    .reports-day-picker { margin: 0 0 16px; max-width: min(520px, 100%); }
    .reports-day-picker label { margin-bottom: 6px; }
    .reports-day-select { width: 100%; margin: 0; min-height: 42px; }
    .reports-day-panel.reports-day-block { margin-bottom: 16px; }
    .reports-day-inline-head {
      flex-shrink: 0;
      padding: 12px 16px; background: rgba(0, 0, 0, 0.22); border-bottom: 1px solid var(--dash-border);
      display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: baseline;
    }
    .reports-table-wrap { overflow: auto; }
    #app > .main-area.main--reports .reports-table-wrap {
      flex: 1;
      min-height: 0;
    }
    .reports-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .reports-table th {
      text-align: left; padding: 10px 12px; font-size: 10px; text-transform: uppercase;
      letter-spacing: 0.07em; color: var(--dash-muted); border-bottom: 1px solid var(--dash-border);
      background: rgba(15, 24, 40, 0.95); position: sticky; top: 0; z-index: 1;
    }
    .reports-table td { padding: 11px 12px; border-bottom: 1px solid var(--dash-border); vertical-align: top; }
    .reports-table tbody tr:hover td { background: rgba(255, 255, 255, 0.035); }
    .reports-cell-time { color: var(--accent-gold); font-weight: 600; white-space: nowrap; }
    .reports-cell-detail { color: var(--dash-text); line-height: 1.45; max-width: min(460px, 36vw); }
    .reports-cell-related { color: var(--dash-muted); font-size: 12px; max-width: min(300px, 28vw); line-height: 1.4; }
    .reports-cell-sub { margin-top: 6px; font-size: 11px; opacity: 0.92; }
    .reports-cell-metric { white-space: nowrap; color: var(--dash-text); }
    .reports-table tr.reports-row-clock-in td:nth-child(2) { color: var(--accent-gold); font-weight: 600; }
    .reports-table tr.reports-row-clock-out td:nth-child(2) { color: #8eb4d9; }
    .reports-table tr.reports-row-absence td:nth-child(2) { color: #e8a87c; }
    .reports-entity-bar {
      display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; margin: 0 0 14px;
      padding: 14px; background: var(--dash-card); border: 1px solid var(--dash-border); border-radius: var(--radius);
    }
    .reports-entity-bar label { margin: 0; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; }
    .reports-entity-bar select { min-width: 260px; margin: 0; }
    .reports-entity-meta {
      white-space: pre-wrap; font-size: 12px; color: var(--dash-muted); margin: 0 0 14px; padding: 14px;
      border-radius: var(--radius); border: 1px solid var(--dash-border); background: rgba(0, 0, 0, 0.18);
      max-height: 180px; overflow: auto; line-height: 1.45;
    }
    .reports-placeholder { color: var(--dash-muted); font-size: 14px; padding: 28px 8px; text-align: center; }

    /* Dashboard */
    .dash-header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 18px; }
    .dash-header h1 { margin: 0; font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; }
    .dash-sub { margin: 6px 0 0; color: var(--dash-muted); font-size: 14px; max-width: 520px; line-height: 1.45; }
    .dash-meta { text-align: right; font-size: 13px; color: var(--dash-muted); }
    .dash-meta .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent-green); margin-right: 6px; vertical-align: middle; }
    .dash-meta .clock { margin-top: 6px; font-weight: 500; color: var(--dash-text); }
    .payroll-banner {
      background: linear-gradient(90deg, rgba(220,38,38,0.25), rgba(180,20,20,0.15));
      border: 1px solid rgba(248,113,113,0.35);
      border-radius: var(--radius);
      padding: 14px 18px;
      margin-bottom: 18px;
      cursor: pointer;
      text-align: left;
      width: 100%;
      font: inherit;
      color: inherit;
      transition: transform 0.12s ease, background 0.12s;
    }
    .payroll-banner:hover { transform: scale(1.002); background: linear-gradient(90deg, rgba(220,38,38,0.32), rgba(180,20,20,0.22)); }
    .payroll-banner strong { display: block; font-size: 15px; margin-bottom: 6px; color: #fecaca; }
    .payroll-banner span { color: var(--dash-muted); font-size: 13px; line-height: 1.4; }

    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .kpi-card {
      background: var(--dash-card);
      border: 1px solid var(--dash-border);
      border-radius: var(--radius);
      padding: 14px 14px 12px;
      cursor: pointer;
      text-align: left;
      width: 100%;
      font: inherit;
      color: inherit;
      transition: background 0.15s, border-color 0.15s, transform 0.12s;
      position: relative;
      overflow: hidden;
    }
    .kpi-card::before {
      content: "";
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: var(--kpi-accent, var(--accent-blue));
    }
    .kpi-card:hover { background: #1a273d; border-color: #3d4f6a; transform: translateY(-1px); }
    .kpi-card.accent-blue { --kpi-accent: var(--accent-blue); }
    .kpi-card.accent-gold { --kpi-accent: var(--accent-gold); }
    .kpi-card.accent-red { --kpi-accent: var(--accent-red); }
    .kpi-card.accent-cyan { --kpi-accent: var(--accent-cyan); }
    .kpi-card.accent-green { --kpi-accent: var(--accent-green); }
    .kpi-card.tables { --kpi-accent: var(--accent-cyan); }
    .kpi-primary { font-size: 1.45rem; font-weight: 700; margin: 8px 0 6px; }
    .kpi-sub { font-size: 12px; color: var(--dash-muted); line-height: 1.35; margin-bottom: 8px; }
    .kpi-sub-em { color: var(--kpi-accent, var(--accent-blue)); font-weight: 500; }
    .kpi-spark-wrap { margin-top: 6px; }
    .kpi-spark-cap { font-size: 10px; color: var(--dash-muted); margin-top: 4px; }
    .kpi-spark { height: 28px; width: 100%; opacity: 0.85; display: block; }
    .kpi-progress { height: 8px; border-radius: 4px; background: #2d3b50; margin: 10px 0 4px; overflow: hidden; }
    .kpi-progress > i { display: block; height: 100%; background: var(--kpi-accent, var(--accent-cyan)); border-radius: 4px; }

    .dash-mid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 14px; margin-bottom: 18px; }
    @media (max-width: 960px) { .dash-mid { grid-template-columns: 1fr; } }
    .panel-title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .panel-title-row h2 { margin: 0; }
    .pill-btn {
      font-size: 11px; padding: 6px 12px; border-radius: 999px;
      border: 1px solid var(--dash-border); background: rgba(255,255,255,0.05);
      color: var(--dash-text); cursor: pointer; font-family: inherit;
    }
    .pill-btn:hover { background: rgba(255,255,255,0.1); }
    .critical-label { color: var(--accent-red); font-size: 12px; font-weight: 600; margin-bottom: 10px; }
    .inv-alert {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      width: 100%;
      text-align: left;
      background: rgba(127,29,29,0.25);
      border: 1px solid rgba(248,113,113,0.25);
      border-radius: 10px;
      padding: 10px 12px; margin-bottom: 8px;
      cursor: pointer; font: inherit; color: inherit;
      transition: background 0.12s;
    }
    .inv-alert.reorder {
      background: rgba(180, 140, 40, 0.15);
      border-color: rgba(232, 184, 74, 0.35);
    }
    .inv-alert.reorder:hover { background: rgba(180, 140, 40, 0.25); }
    .inv-alert.info {
      background: rgba(59, 130, 246, 0.1);
      border-color: rgba(59, 130, 246, 0.25);
    }
    .inv-alert.info:hover { background: rgba(59, 130, 246, 0.18); }
    .inv-alert .t { font-weight: 600; display: block; line-height: 1.35; }
    .inv-alert .d { font-size: 12px; color: var(--dash-muted); display: block; line-height: 1.45; margin-top: 0; }

    .chart-caption { font-size: 12px; color: var(--dash-muted); margin-bottom: 8px; }
    .chart-wrap-hourly { width: 100%; margin: 8px 0 4px; }
    .chart-svg-hourly { width: 100%; height: 220px; display: block; }
    .chart-axis-labels { display: flex; justify-content: space-between; font-size: 10px; color: var(--dash-muted); margin-top: 4px; padding: 0 4px; }
    .chart-svg { width: 100%; height: auto; display: block; }
    .chart-hit {
      fill: transparent; cursor: pointer;
    }
    .chart-hit:hover { fill: rgba(59,130,246,0.08); }

    .top-dish {
      display: flex;
      align-items: stretch;
      gap: 12px;
      margin-bottom: 10px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid rgba(45, 59, 80, 0.85);
      background: rgba(15, 25, 40, 0.65);
    }
    .top-dish:hover { background: rgba(21, 31, 50, 0.92); border-color: #4b5f80; }
    .top-dish-photo-wrap {
      width: 56px; height: 56px; flex-shrink: 0; border-radius: 10px; overflow: hidden;
      background: #1a273d; display: flex; align-items: center; justify-content: center;
    }
    .top-dish-photo {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .top-dish-photo-ph { font-size: 10px; text-align: center; padding: 4px; color: var(--dash-muted); line-height: 1.25; }
    .top-dish-text { flex: 1; min-width: 0; }
    .top-dish .row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; gap: 8px; }
    .top-dish .bar { height: 6px; border-radius: 3px; background: #2d3b50; overflow: hidden; }
    .top-dish .bar > i { display: block; height: 100%; background: var(--accent-blue); border-radius: 3px; }

    .roster-section { margin-bottom: 18px; }
    .roster-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
    .roster-head h2 { margin: 0; font-size: 1.1rem; }
    .roster-badge { font-size: 12px; padding: 4px 10px; border-radius: 8px; background: rgba(232,184,74,0.15); color: var(--accent-gold); border: 1px solid rgba(232,184,74,0.35); }
    .roster-sub { font-size: 13px; color: var(--dash-muted); margin-bottom: 12px; }
    .roster-grid { display: flex; flex-wrap: wrap; gap: 10px; }
    .staff-card {
      display: flex; align-items: center; gap: 10px;
      min-width: 160px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--dash-border);
      background: var(--dash-card);
      cursor: pointer;
      font: inherit; color: inherit;
      text-align: left;
      transition: background 0.12s, transform 0.12s;
    }
    .staff-card:hover { background: #1a273d; transform: translateY(-1px); }
    .staff-av { width: 36px; height: 36px; border-radius: 50%; background: #2d3b50; flex-shrink: 0; }
    .staff-name { font-weight: 600; font-size: 13px; }
    .staff-role { font-size: 11px; color: var(--dash-muted); }
    .staff-st { font-size: 11px; color: var(--dash-muted); margin-top: 2px; }
    .dot-off { background: #64748b; }
    .dot-on { background: var(--accent-green); }

    .dash-bottom { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 14px; align-items: start; }
    @media (max-width: 960px) { .dash-bottom { grid-template-columns: 1fr; } }

    .act-list { display: flex; flex-direction: column; gap: 0; max-height: 70vh; overflow: auto; }
    .act-card {
      border: none;
      border-top: 1px solid rgba(196,160,53,0.35);
      background: transparent;
      padding: 12px 4px;
      cursor: pointer;
      text-align: left;
      font: inherit;
      color: inherit;
      width: 100%;
      transition: background 0.12s;
    }
    .act-card:first-child { border-top: none; }

    }
    .emp-acc-item.open .emp-acc-chev { transform: rotate(-180deg); }
    .emp-acc-body { padding: 0 16px 18px 16px; }
    .emp-acc-inner { display: grid; grid-template-columns: 140px 1fr; gap: 18px; margin-top: 4px; min-width: 0; }
    .emp-acc-inner > * { min-width: 0; max-width: 100%; box-sizing: border-box; }
    @media (max-width: 640px) { .emp-acc-inner { grid-template-columns: 1fr; } }
    .emp-photo-box {
      position: relative; width: 120px; height: 120px; border-radius: 12px; overflow: hidden;
      background: linear-gradient(160deg, #1a2538, #0f172a);
      border: 1px solid var(--dash-border);
    }
    .emp-photo-initials {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 2rem; font-weight: 700; color: var(--accent-gold); letter-spacing: 0.04em;
    }
    .emp-photo-img {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; display: none;
    }
    .emp-photo-img.is-visible { display: block; }
    .emp-photo-box:has(.emp-photo-img.is-visible) .emp-photo-initials { display: none; }
    .emp-notes-lbl {
      display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--dash-muted); margin: 14px 0 6px; font-weight: 600;
    }
    .emp-notes-box {
      min-height: 72px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--dash-border);
      background: #0b1220; color: var(--dash-muted); font-size: 13px; line-height: 1.5;
      max-width: 100%; box-sizing: border-box;
      white-space: pre-wrap; overflow-wrap: break-word; word-break: break-all;
      overflow-x: hidden;
    }
    .emp-detail-sec { margin-bottom: 16px; }
    .emp-detail-sec h4 {
      margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--dash-muted); font-weight: 600;
    }
    .emp-tag-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .emp-tag {
      font-size: 12px; padding: 5px 12px; border-radius: 999px; font-weight: 600;
      background: rgba(59,130,246,0.12); color: #7dd3fc; border: 1px solid rgba(59,130,246,0.28);
    }
    .emp-tag-muted { background: rgba(148,163,184,0.1); color: #cbd5e1; border-color: rgba(148,163,184,0.25); }
    .emp-schedule-bar {
      padding: 12px 14px; border-radius: 10px; background: #151e2e; border: 1px solid var(--dash-border);
      font-size: 13px; color: #cbd5e1; line-height: 1.55;
      max-width: 100%; box-sizing: border-box;
      white-space: pre-wrap; overflow-wrap: break-word; word-break: break-word;
      overflow-x: hidden;
    }

    /* Money dashboard (read-only web) */
    .money-dash { width: 100%; max-width: none; margin: 0; }
    .money-dash-head {
      display: flex; align-items: center; min-height: 48px; margin-bottom: 4px;
    }
    .money-dash-head h1 {
      margin: 0; font-size: clamp(1.45rem, 2.4vw, 1.85rem); font-weight: 700; letter-spacing: -0.02em; color: #fff;
    }
    .money-dash-head .part-gold { color: var(--accent-gold); }
    .money-dash-kpis {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 22px 0 18px;
    }
    @media (max-width: 900px) { .money-dash-kpis { grid-template-columns: 1fr; } }
    .money-kpi {
      background: var(--dash-card); border: 1px solid var(--dash-border); border-radius: var(--radius);
      padding: 18px 16px; text-align: center;
    }
    .money-kpi-lbl {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--dash-muted);
      font-weight: 600; margin-bottom: 10px;
    }
    .money-kpi-val { font-size: 1.35rem; font-weight: 700; line-height: 1.35; }
    .money-kpi-val.money-pos { color: var(--accent-green); }
    .money-kpi-val.money-neg { color: var(--accent-red); }
    .money-kpi-val .money-pos { color: var(--accent-green); }
    .money-kpi-val .money-neg { color: var(--accent-red); }
    .money-dual-sep { color: var(--dash-muted); font-weight: 500; }
    .money-toolbar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px;
      margin-bottom: 16px; padding: 12px 0; border-bottom: 1px solid var(--dash-border);
    }
    .money-toolbar-showing { font-size: 14px; color: var(--dash-muted); }
    .money-toolbar-showing strong { color: var(--dash-text); font-weight: 600; }
    .money-preset-group { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; justify-content: center; }
    .money-preset-btn {
      min-height: 36px; padding: 0 14px; border-radius: 999px; font: inherit; font-size: 13px; font-weight: 600;
      border: 1px solid var(--dash-border); background: rgba(255,255,255,0.04); color: var(--dash-muted);
      cursor: pointer;
    }
    .money-preset-btn:hover { background: rgba(255,255,255,0.08); color: var(--dash-text); }
    .money-preset-btn.active {
      background: rgba(59,130,246,0.22); border-color: rgba(59,130,246,0.45); color: #93c5fd;
    }
    .money-dash-main {
      display: grid; grid-template-columns: 1fr minmax(260px, 300px); gap: 18px; align-items: start;
    }
    @media (max-width: 1024px) { .money-dash-main { grid-template-columns: 1fr; } }
    .money-ledger-panel {
      background: var(--dash-card); border: 1px solid var(--dash-border); border-radius: var(--radius);
      overflow: hidden; min-width: 0;
    }
    .money-ledger-panel h2 {
      margin: 0; padding: 14px 16px; font-size: 15px; font-weight: 700;
      border-bottom: 1px solid var(--dash-border); color: var(--dash-text);
    }
    .money-ledger-scroll {
      max-height: min(68vh, 720px); overflow: auto;
    }
    .money-ledger { width: 100%; border-collapse: collapse; font-size: 13px; }
    .money-ledger th, .money-ledger td {
      text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--dash-border);
      vertical-align: top;
    }
    .money-ledger th {
      position: sticky; top: 0; background: #121c2c; z-index: 1;
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dash-muted); font-weight: 600;
    }
    .money-ledger tbody tr:hover td { background: rgba(255,255,255,0.03); }
    .money-ledger .cell-amt { text-align: right; font-weight: 650; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .money-sidebar { display: flex; flex-direction: column; gap: 12px; }
    .money-side-card {
      background: var(--dash-card); border: 1px solid var(--dash-border); border-radius: var(--radius);
      padding: 16px; text-align: center;
    }
    .money-side-card .lbl {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dash-muted); font-weight: 600;
      margin-bottom: 8px;
    }
    .money-side-card .fig { font-size: 1.15rem; font-weight: 700; line-height: 1.35; }
    .money-side-card .fig.money-pos { color: var(--accent-green); }
    .money-side-card .fig.money-neg { color: var(--accent-red); }
    .money-side-card .fig .money-pos { color: var(--accent-green); }
    .money-side-card .fig .money-neg { color: var(--accent-red); }
    .money-summary-list dd.money-pos { color: var(--accent-green); }
    .money-summary-list dd.money-neg { color: var(--accent-red); }
    .money-summary-list dd .money-pos { color: var(--accent-green); }
    .money-summary-list dd .money-neg { color: var(--accent-red); }
    .money-ledger .cell-amt .money-pos { color: var(--accent-green); }
    .money-ledger .cell-amt .money-neg { color: var(--accent-red); }
    .money-summary-list {
      background: var(--dash-card); border: 1px solid var(--dash-border); border-radius: var(--radius);
      padding: 14px 16px; font-size: 13px;
    }
    .money-summary-list h3 {
      margin: 0 0 12px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--dash-muted); font-weight: 600;
    }
    .money-summary-list dl { margin: 0; }
    .money-summary-list dt {
      color: var(--dash-muted); font-size: 12px; margin-top: 10px;
    }
    .money-summary-list dt:first-child { margin-top: 0; }
    .money-summary-list dd { margin: 4px 0 0; font-weight: 600; color: var(--dash-text); }
    .money-report-btn {
      width: 100%; min-height: 44px; border-radius: var(--radius); font: inherit; font-weight: 600; font-size: 14px;
      cursor: pointer; border: 1px solid var(--dash-border);
      background: #1a2332; color: var(--dash-text);
    }
    .money-report-btn:hover { background: #243044; }
    .money-report-note { font-size: 11px; color: var(--dash-muted); text-align: center; margin-top: 6px; }
  </style>
</head>
<body>
  <div id="adminLoginScreen" class="admin-login-screen">
    <div class="admin-login card">
      <div id="adminLangLogin" class="admin-lang-wrap"></div>
      <h1 class="admin-login__title" data-i18n="staff.adminWeb">Admin web</h1>
      <div id="adminLoginError" class="admin-login__error danger hidden" role="alert"></div>
      <form id="adminLoginForm" class="admin-login__form" autocomplete="off" novalidate>
        <label for="adminLoginId" data-i18n="auth.signInId">Sign-in ID</label>
        <input id="adminLoginId" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="">
        <label for="adminLoginPin" data-i18n="auth.pin">PIN</label>
        <input id="adminLoginPin" type="password" autocomplete="off" value="">
        <button type="submit" class="btn btn-primary btn-block" id="adminLoginSubmit" data-i18n="common.signIn">Sign in</button>
      </form>
    </div>
  </div>

  <div id="app" class="layout hidden">
    <aside class="sidebar">
      <div class="brand-wrap">
        <img id="brandLogo" class="brand-logo hidden" alt="" data-i18n="portals.admin.brandDefault" data-i18n-attr="alt">
        <div id="brandName" class="brand">Admin</div>
        <div class="brand-sub" data-i18n="portals.admin.brandSub">Read-only mirrors: dashboard, operations snapshot, reports.</div>
      </div>
      <div id="adminLangSidebar" class="admin-lang-wrap"></div>
      <button type="button" class="nav-btn active" data-view="dashboard" data-i18n="portals.admin.navDashboard">Dashboard</button>
      <button type="button" class="nav-btn" data-view="orders" data-i18n="portals.admin.navOrders">Orders</button>
      <button type="button" class="nav-btn" data-view="inventory" data-i18n="portals.admin.navInventory">Inventory</button>
      <button type="button" class="nav-btn" data-view="menu" data-i18n="portals.admin.navMenu">Menu</button>
      <button type="button" class="nav-btn" data-view="tables" data-i18n="portals.admin.navTables">Tables</button>
      <button type="button" class="nav-btn" data-view="employees" data-i18n="portals.admin.navEmployees">Employees</button>
      <button type="button" class="nav-btn" data-view="money" data-i18n="portals.admin.navMoney">Money</button>
      <button type="button" class="nav-btn" data-view="reports" data-i18n="portals.admin.navReports">Reports</button>
      <div class="who">
        <div id="sessionLabel"></div>
        <button type="button" class="btn btn-ghost btn-block" id="btnLogout" style="margin-top:10px;" data-i18n="portals.admin.signOut">Sign out</button>
      </div>
    </aside>
    <main class="main-area" id="main"></main>
  </div>

  <script src="/shared/api-error-banner.js"></script>
  <script src="/js/elite-portal-session.js"></script>
  <script src="/shared/restaurant-datetime.js"></script>
  <script>window.EliteI18nDisableAutoInit = true;</script>
  <script src="/js/elite-i18n.js?v=6"></script>
  <script>
    const TOKEN_KEY = "eliteAdminWebJwt";
    const PORTAL_ID = "AdminWeb";
    const NAV_FILTER_KEY = "eliteAdminNavFilter";
    const MONEY_COLOR_POS = "#4ade80";
    const MONEY_COLOR_NEG = "#f87171";
    let token = sessionStorage.getItem(TOKEN_KEY) || "";
    if (token && window.ElitePortalSession && !window.ElitePortalSession.isJwtUsable(token)) {
      token = "";
      sessionStorage.removeItem(TOKEN_KEY);
    }
    let dashClockTimer = null;
    let portalConfig = { restaurantName: "", restaurantLogoUrl: "" };
    let currentView = "dashboard";

    function t(key, fallback, vars) {
      const full = key.indexOf("portals.") === 0 || key.indexOf("auth.") === 0 || key.indexOf("common.") === 0 || key.indexOf("orders.") === 0
        ? key
        : "portals.admin." + key;
      return (window.EliteI18n && EliteI18n.t) ? EliteI18n.t(full, fallback, vars) : (fallback != null ? String(fallback) : full);
    }

    function metaSlug(value) {
      return String(value || "").trim().toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
    }

    function normalizeStatusKey(status) {
      const raw = String(status ?? "").trim();
      if (!raw) return "";
      const spaced = raw.replace(/([a-z])([A-Z])/g, "$1 $2");
      const n = spaced.replace(/\s+/g, " ").trim().toLowerCase();
      const aliases = {
        waiting: "waiting", "pending approval": "pending_approval", "pending cashier": "pending_cashier",
        "in kitchen": "in_kitchen", ready: "ready", served: "served", completed: "completed",
        cancelled: "cancelled", canceled: "cancelled", pending: "pending", "on account": "on_account", debt: "on_account"
      };
      return aliases[n] || metaSlug(n);
    }

    const STATUS_FALLBACK_EN = {
      pending_approval: "Pending approval", pending_cashier: "Pending cashier", waiting: "Waiting",
      in_kitchen: "In kitchen", ready: "Ready", served: "Served", completed: "Completed",
      cancelled: "Cancelled", pending: "Pending", on_account: "On account"
    };
    const STATUS_FALLBACK_FR = {
      pending_approval: "En attente d'approbation", pending_cashier: "En attente caisse", waiting: "En attente",
      in_kitchen: "En cuisine", ready: "Prête", served: "Servie", completed: "Terminée",
      cancelled: "Annulée", pending: "En attente", on_account: "En compte"
    };
    const STATUS_ORDERS_KEY = {
      pending_approval: "orders.pendingApproval", pending_cashier: "orders.pendingCashier", waiting: "orders.waiting",
      in_kitchen: "orders.inKitchen", ready: "orders.ready", served: "orders.served",
      completed: "orders.completed", cancelled: "orders.cancelled", pending: "orders.pending"
    };

    function currentLangCode() {
      if (window.EliteI18n && EliteI18n.lang) return EliteI18n.lang;
      try {
        const raw = localStorage.getItem("elite_lang");
        if (raw != null && String(raw).trim() !== "") return raw.indexOf("fr") === 0 ? "fr" : "en";
      } catch (e) {}
      return "fr";
    }

    let lastDashboardPayload = null;

    function translateOrderStatus(status) {
      const raw = String(status ?? "").trim();
      if (!raw) return raw;
      const key = normalizeStatusKey(raw);
      if (!key) return raw;
      const lang = currentLangCode();
      const fb = (lang === "fr" ? STATUS_FALLBACK_FR : STATUS_FALLBACK_EN)[key] || raw;
      let translated = t("status." + key, fb);
      if (translated && translated.indexOf("portals.admin.") !== 0) return translated;
      const ordersKey = STATUS_ORDERS_KEY[key];
      if (ordersKey) {
        translated = t(ordersKey, fb);
        if (translated && translated.indexOf("orders.") !== 0) return translated;
      }
      return fb;
    }

    function normalizeMetaKey(kind, value) {
      const raw = String(value ?? "").trim();
      if (!raw) return "";
      const spaced = raw.replace(/([a-z])([A-Z])/g, "$1 $2");
      const n = spaced.replace(/\s+/g, " ").trim().toLowerCase();
      const aliases = {
        payment: { deferred: "deferred", immediate: "immediate", "pay now": "pay_now", "on account": "on_account" },
        origin: { online: "online", "dine in": "dine_in", "dine-in": "dine_in", "walk in": "walk_in", "walk-in": "walk_in" },
        source: { delivery: "delivery", pickup: "pickup", "dine in": "dine_in", "dine-in": "dine_in", table: "table" }
      };
      return (aliases[kind] && aliases[kind][n]) || metaSlug(n);
    }

    const META_FALLBACK_FR = {
      payment: { deferred: "Différé", immediate: "Immédiat", pay_now: "Payer maintenant", on_account: "En compte" },
      origin: { online: "En ligne", dine_in: "Sur place", walk_in: "Sans réservation" },
      source: { delivery: "Livraison", pickup: "À emporter", dine_in: "Sur place", table: "Table" }
    };
    const META_FALLBACK_EN = {
      payment: { deferred: "Deferred", immediate: "Immediate", pay_now: "Pay now", on_account: "On account" },
      origin: { online: "Online", dine_in: "Dine-in", walk_in: "Walk-in" },
      source: { delivery: "Delivery", pickup: "Pickup", dine_in: "Dine-in", table: "Table" }
    };

    function translateMetaValue(kind, value) {
      const raw = String(value ?? "").trim();
      if (!raw) return raw;
      if (raw.includes("·")) {
        return raw.split("·").map(part => translateMetaValue(kind, part.trim())).join(" · ");
      }
      const slug = normalizeMetaKey(kind, raw);
      if (!slug) return raw;
      const lang = currentLangCode();
      const fbMap = lang === "fr" ? META_FALLBACK_FR : META_FALLBACK_EN;
      const fb = (fbMap[kind] && fbMap[kind][slug]) || raw;
      const translated = t("meta." + kind + "." + slug, fb);
      if (translated && translated.indexOf("portals.admin.") !== 0) return translated;
      return fb;
    }

    function translateDashboardSubtitle(key, apiSubtitle) {
      const sub = String(apiSubtitle ?? "").trim();
      if (!sub) return sub;

      let m = sub.match(/(-?\d+(?:\.\d+)?)\s*%\s*vs\s+yesterday\s*·\s*Money\s*\(USD\)/i);
      if (m) return t("kpiDeltaUsd", "{{delta}}% vs yesterday · Money (USD).", { delta: m[1] });
      m = sub.match(/(-?\d+(?:\.\d+)?)\s*%\s*vs\s+yesterday\s*·\s*Money\s*\(FC\)/i);
      if (m) return t("kpiDeltaFc", "{{delta}}% vs yesterday · Money (FC).", { delta: m[1] });
      m = sub.match(/(-?\d+(?:\.\d+)?)\s*%\s*vs\s+yesterday\s*·\s*all\s+in\s+USD/i);
      if (m) return t("kpiDeltaExp", "{{delta}}% vs yesterday · all in USD.", { delta: m[1] });
      if (key === "completedToday") {
        m = sub.match(/(-?\d+(?:\.\d+)?)\s*%\s*vs\s+yesterday/i);
        if (m) return t("kpiDeltaCompleted", "{{delta}}% vs yesterday.", { delta: m[1] });
      }
      if (sub === "No USD revenue yesterday to compare. Money — entries in USD only.")
        return t("kpiNoCompareUsd", sub);
      if (sub === "No FC revenue yesterday to compare. Money — entries in FC only (not converted from USD).")
        return t("kpiNoCompareFc", sub);
      if (sub === "No expenses yesterday to compare. All expenses in USD (FC rows use stored USD equivalent).")
        return t("kpiNoCompareExp", sub);
      if (sub === "No completions yesterday. From orders (not Money ledger).")
        return t("kpiNoCompareCompleted", sub);
      if (/vs\s+yesterday/i.test(sub)) {
        return sub
          .replace(/vs\s+yesterday/gi, t("kpiVsYesterday", "vs yesterday"))
          .replace(/Money\s*\(USD\)/gi, t("kpiMoneyUsdShort", "Money (USD)"))
          .replace(/Money\s*\(FC\)/gi, t("kpiMoneyFcShort", "Money (FC)"))
          .replace(/all\s+in\s+USD/gi, t("kpiAllInUsd", "all in USD"));
      }
      return sub;
    }

    function translateEmployeeRole(role) {
      const raw = String(role ?? "").trim();
      if (!raw) return raw;
      const slug = metaSlug(raw);
      if (!slug) return raw;
      const translated = t("role." + slug, raw);
      return translated.indexOf("portals.admin.role.") === 0 ? raw : translated;
    }

    function localizeDashboardKpi(k, s) {
      const key = String(k.key || k.Key || "").trim();
      const apiPrimary = k.primaryText || k.PrimaryText || "";
      const apiSub = k.subtitle || k.Subtitle || "";
      const occ = Number(pick(s, "occupiedTables", "OccupiedTables")) || 0;
      const tot = Number(pick(s, "totalTables", "TotalTables")) || 0;
      const avail = Number(pick(s, "availableTables", "AvailableTables")) || 0;
      const tTot = tot > 0 ? tot : occ + avail || 0;
      const ao = pick(s, "activeOrders", "ActiveOrders") || 0;
      const inKitchen = pick(s, "inKitchenNow", "InKitchenNow") ?? 0;
      switch (key) {
        case "todayUsd":
          return { label: t("kpiTodayUsd", "Today's revenue (USD)"), primary: apiPrimary, subtitle: translateDashboardSubtitle(key, apiSub) };
        case "todayFc":
          return { label: t("kpiTodayFc", "Today's revenue (FC)"), primary: apiPrimary, subtitle: translateDashboardSubtitle(key, apiSub) };
        case "todayExp":
          return { label: t("kpiTodayExp", "Today's expenses"), primary: apiPrimary, subtitle: translateDashboardSubtitle(key, apiSub) };
        case "tables":
          return {
            label: t("kpiTables", "Tables occupied"),
            primary: t("kpiTablesPrimary", "{{occupied}}/{{total}} occupied", { occupied: occ, total: tTot }),
            subtitle: t("kpiTablesSub", "{{count}} active orders", { count: ao })
          };
        case "activeOrders":
          return {
            label: t("kpiActiveOrders", "Active orders"),
            primary: apiPrimary,
            subtitle: t("kpiActiveOrdersSub", "{{count}} in kitchen now", { count: inKitchen })
          };
        case "completedToday":
          return {
            label: t("kpiCompletedToday", "Orders completed today"),
            primary: apiPrimary,
            subtitle: translateDashboardSubtitle(key, apiSub)
          };
        default:
          return { label: k.label || k.Label || key, primary: apiPrimary, subtitle: translateDashboardSubtitle(key, apiSub) };
      }
    }

    function translateApiStatus(text) {
      const raw = String(text ?? "").trim();
      if (!raw) return raw;
      if (raw === "Cloud API — Connected") return t("dashApiConnected", raw);
      return raw;
    }

    function translateInventoryDetail(detail) {
      let d = String(detail ?? "");
      d = d.replace(/\bstatus:\s*Low\b/gi, t("invStatusLow", "status: Low"));
      d = d.replace(/\bstatus:\s*Healthy\b/gi, t("invStatusHealthy", "status: Healthy"));
      d = d.replace(/\bstatus:\s*Reorder\b/gi, t("invStatusReorder", "status: Reorder"));
      d = d.replace(/\bstatus:\s*Out\b/gi, t("invStatusOut", "status: Out"));
      d = d.replace(/\bstatus:\s*Critical\b/gi, t("invStatusCritical", "status: Critical"));
      return d;
    }

    function translateInventoryActorName(name) {
      const n = String(name ?? "").trim();
      if (/^Unassigned Chef$/i.test(n)) return t("invActorUnassignedChef", "Unassigned Chef");
      if (/^Unassigned Barman$/i.test(n)) return t("invActorUnassignedBarman", "Unassigned Barman");
      return n;
    }

    function translateMoneyJustification(jus) {

      m = raw.match(/^Cash change returned for order (ORD-[A-F0-9]+) \((USD|FC)\)\. (\| CHANGE_ORDER:\d+:(USD|FC)\|)$/i);

      m = raw.match(/^(Partial|Final) monthly salary payment to (.+?) for (\w+ \d{4}) \(units:(\d+) sales USD:([\d.]+) bonus:([\d.]+) advances deducted:([\d.]+)\) (\| EMP:\d+\| NET:[\d.]+ THIS:[\d.]+ CUMULATIVE:[\d.]+\|)$/i);

    function translateActivityTimestamp(line) {

      const monthIdx = REP_SHORT_MONTHS[m[1].slice(0, 3).toLowerCase()];

      const d = new Date(Number(m[3]), monthIdx, Number(m[2]), Number(m[4]), Number(m[5]));

      const lang = currentLangCode() === "fr" ? "fr-FR" : "en-US";
      const datePart = d.toLocaleDateString(lang, { month: "short", day: "2-digit", year: "numeric" });
      const timePart = d.toLocaleTimeString(lang, { hour: "2-digit", minute: "2-digit", hour12: lang !== "fr-FR" });

    const REP_SHORT_MONTHS = {

    function translateReportDayText(dayText) {

    function translateReportSummary(text) {
      let raw = String(text ?? "").trim();
      if (!raw) return raw;

      let m = raw.match(/^(.+?) marked absent$/i);
      if (m) return t("repAttMarkedAbsent", "{{name}} marked absent", { name: m[1] });

      m = raw.match(/^(.+?) signed in at (\d{1,2}:\d{2}) \((.+)\)$/i);
      if (m) {
        return t("repAttSignedIn", "{{name}} signed in at {{time}} ({{status}})", {
          name: m[1], time: m[2], status: translateAttendanceClockStatus(m[3])
        });
      }

      m = raw.match(/^(.+?) scheduled \(not clocked in yet\)$/i);
      if (m) return t("repAttScheduledNotIn", "{{name}} scheduled (not clocked in yet)", { name: m[1] });

      m = raw.match(/^(.+?) clocked out at (\d{1,2}:\d{2})$/i);
      if (m) return t("repAttClockedOut", "{{name}} clocked out at {{time}}", { name: m[1], time: m[2] });

      m = raw.match(/^Absent \((.+)\)$/i);
      if (m) return t("repAttAbsentStatus", "Absent ({{status}})", { status: translateAttendanceClockStatus(m[1]) });

      m = raw.match(/^Sign in: (.+?) \((.+)\) \| Clock out: (.+)$/i);
      if (m) {
        return t("repAttSignInOut", "Sign in: {{in}} ({{status}}) | Clock out: {{out}}", {
          in: m[1], status: translateAttendanceClockStatus(m[2]), out: m[3] === "Not clocked out" ? t("empNotClockedOut", "Not clocked out") : m[3]
        });
      }

      if (raw.startsWith("Scheduled | Clock out:")) {
        const out = raw.slice("Scheduled | Clock out:".length).trim();
        return t("repAttScheduledClockOut", "Scheduled | Clock out: {{out}}", {
          out: out === "Not clocked out" ? t("empNotClockedOut", "Not clocked out") : out
        });
      }

      m = raw.match(/^Order (ORD-[A-F0-9]+|#[0-9]+) · (\d+) item\(s\)$/i);
      if (m) {
        return t("repOrderItems", "Order {{orderId}} · {{count}} item(s)", { orderId: m[1], count: m[2] });
      }

      m = raw.match(/^Order (ORD-[A-F0-9]+) \((.+)\)$/i);
      if (m) {
        return t("repOrderStatus", "Order {{orderId}} ({{status}})", {
          orderId: m[1], status: translateOrderStatus(m[2])
        });
      }

      m = raw.match(/^Reservation (ORD-[A-Z0-9-]+|RES-[A-Z0-9-]+|\S+) · (.+?) · (.+)$/i);
      if (m) {
        return t("repReservationLine", "Reservation {{id}} · {{name}} · {{status}}", {
          id: m[1], name: m[2], status: translateOrderStatus(m[3])
        });

      m = raw.match(/^Reservation (RES-[A-F0-9]+|\S+) \((.+)\)$/i);

        return t("repReservationStatus", "Reservation {{id}} ({{status}})", {
          id: m[1], status: translateOrderStatus(m[2])
        });
      }

      m = raw.match(/^(.+?) x(\d+)$/i);
      if (m) return t("repMenuQty", "{{name}} x{{qty}}", { name: m[1], qty: m[2] });

      m = raw.match(/^(.+?) ×(\d+)$/);
      if (m) return t("repMenuQty", "{{name}} x{{qty}}", { name: m[1], qty: m[2] });

      if (raw === "Text-based inventory history entry") return t("repInvTextEntry", raw);

      const moneyJ = translateMoneyJustification(raw);
      if (moneyJ !== raw) return moneyJ;

      const invJ = translateInventoryNoteLine(raw);
      if (invJ !== raw) return invJ;

      m = raw.match(/^(.+?) \| Server: (.+?) \| Items: (\d+)$/i);

        });

      m = raw.match(/^(.+?) \| Server: (.+?) \| Status: (.+)$/i);
      if (m) {
        return t("repTableServerStatus", "{{table}} | Server: {{server}} | Status: {{status}}", {
          table: translateReportTableCaption(m[1]),
          server: m[2] === "Unassigned" ? t("invActorUnassigned", "Unassigned") : m[2],

        });

        return t("repReservationGuest", "Reservation {{id}} | Guest: {{guest}} | Party: {{party}}", {
          id: m[1], guest: m[2], party: m[3]
        });
      }

      m = raw.match(/^Reserved for (\d{4}-\d{2}-\d{2} \d{2}:\d{2}) \| Party: (\d+) \| Table: (.+)$/i);
      if (m) {
        return t("repReservedFor", "Reserved for {{when}} | Party: {{party}} | Table: {{table}}", {

      if (m) return t("repInvItem", "Item: {{name}} ({{id}})", { name: m[1], id: m[2] });

      if (raw.includes(" | ")) {
        return raw.split(" | ").map(part => translateReportRelated(part.trim())).join(" | ");

    function parseMoneyUsdFromText(text) {
      const m = String(text ?? "").match(/\$\s*(-?[\d,]+\.?\d*)/);
      return m ? parseFloat(m[1].replace(/,/g, "")) : 0;
    }

    function parseMoneyFcFromText(text) {
      const m = String(text ?? "").match(/FC\s*(-?[\d,]+)/i);
      return m ? parseFloat(m[1].replace(/,/g, "")) : 0;
    }

    function splitDualCurrencyText(text) {
      const raw = String(text ?? "").trim();
      if (!raw) return { ledgerPrefix: "", segments: [] };
      let ledgerPrefix = "";
      let body = raw;
      if (body.startsWith("+") || body.startsWith("-")) {
        ledgerPrefix = body[0];
        body = body.slice(1).trim();
      }
      const segments = body.split(/\s*\|\s*/).map(s => s.trim()).filter(Boolean);
      return { ledgerPrefix, segments };
    }

    function signedAmountFromSegment(segment) {
      return /FC/i.test(segment) ? parseMoneyFcFromText(segment) : parseMoneyUsdFromText(segment);
    }

    function moneyColorSigned(n) {
      return Number(n) >= 0 ? MONEY_COLOR_POS : MONEY_COLOR_NEG;
    }

    /** mode: revenue | expense | net | ledger */
    function colorForMoneySegment(segment, mode, ledgerPrefix) {
      if (mode === "revenue") return MONEY_COLOR_POS;
      if (mode === "expense") return MONEY_COLOR_NEG;
      if (mode === "ledger") return ledgerPrefix === "-" ? MONEY_COLOR_NEG : MONEY_COLOR_POS;
      return moneyColorSigned(signedAmountFromSegment(segment));
    }

    function renderMoneyAmountHtml(text, mode) {
      const { ledgerPrefix, segments } = splitDualCurrencyText(text);
      if (!segments.length) return esc(text || "—");
      const html = [];
      for (let i = 0; i < segments.length; i++) {
        if (i > 0) html.push("<span class=\"money-dual-sep\"> | </span>");
        const seg = segments[i];
        const display = (i === 0 && ledgerPrefix ? ledgerPrefix : "") + seg;
        const color = colorForMoneySegment(seg, mode, ledgerPrefix);
        const cls = color === MONEY_COLOR_POS ? "money-pos" : "money-neg";
        html.push("<span class=\"" + cls + "\">" + esc(display) + "</span>");
      }
      return html.join("");
    }

    function setMoneyAmountEl(el, text, mode) {
      if (!el) return;
      el.innerHTML = renderMoneyAmountHtml(text, mode);
      el.classList.remove("money-pos", "money-neg");
      el.style.color = "";
    }

    function moneyColorForLedgerAmountText(text) {
      const t = String(text ?? "").trim();
      if (t.startsWith("-")) return MONEY_COLOR_NEG;
      if (t.startsWith("+")) return MONEY_COLOR_POS;
      return moneyColorSigned(parseMoneyUsdFromText(t));
    }

    function applyMoneyColorEl(el, color) {
      if (!el) return;

    async function api(path, method, body, useAuth) {
      const headers = {};
      if (body) headers["Content-Type"] = "application/json";
      if (useAuth !== false && token) headers["Authorization"] = "Bearer " + token;
      const res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
      const txt = await res.text();
      let json;
      try { json = JSON.parse(txt); } catch (_) { json = { raw: txt }; }
      var result = { ok: res.ok, status: res.status, body: json };
      if (window.EliteApiError) window.EliteApiError.wrap(result);
      return result;
    }

    function localDayKeyFromTs(ts) {
      if (ts == null || ts === "") return "";
      const d = new Date(ts);
      if (Number.isNaN(d.getTime())) return "";
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return y + "-" + m + "-" + day;
    }

    function pastDayLabelForKey(key) {
      if (!key) return "";
      const parts = key.split("-").map(Number);
      if (parts.length !== 3 || parts.some(n => Number.isNaN(n))) return key;
      const dt = new Date(parts[0], parts[1] - 1, parts[2]);
      return dt.toLocaleDateString(undefined, { weekday: "short", year: "numeric", month: "short", day: "numeric" });
    }

    function collectSortedPastDayKeys(rows, getTs) {
      const set = new Set();
      for (const r of rows) {
        const k = localDayKeyFromTs(getTs(r));
        if (k) set.add(k);
      }
      return [...set].sort().reverse();
    }

    /** Unwraps admin entity list payloads (handles string-encoded rows from some JSON pipelines). */
    function normalizeAdminEntityItemRows(rows) {
      const out = [];
      if (!Array.isArray(rows)) return out;
      for (const row of rows) {
        if (row == null) continue;
        if (typeof row === "string") {
          try {
            const o = JSON.parse(row);
            if (o && typeof o === "object") out.push(o);
          } catch (_) { /* skip */ }
          continue;
        }
        if (typeof row === "object") out.push(row);
      }
      return out;
    }

    function normalizeAdminEntityItems(body) {
      if (!body || typeof body !== "object") return [];
      const rawList = body.items ?? body.Items;
      if (rawList == null) return [];
      if (!Array.isArray(rawList)) {
        if (typeof rawList === "string") {
          try {
            const p = JSON.parse(rawList);
            return normalizeAdminEntityItemRows(Array.isArray(p) ? p : []);
          } catch (_) {
            return [];
          }
        }
        return [];
      }
      return normalizeAdminEntityItemRows(rawList);
    }

    function renderHourlyChartBlock(d) {
      const hourlyRaw = pick(d, "hourlyRevenueToday", "HourlyRevenueToday");
      let hourly = Array.isArray(hourlyRaw) ? hourlyRaw.map(x => Math.max(0, Number(x) || 0)) : [];
      if (hourly.length !== 24)
        hourly = Array(24).fill(0);
      const hourlyTotal = hourly.reduce((sum, v) => sum + v, 0);
      const hasHourlyData = hourlyTotal > 0.005;
      const maxReported = Number(pick(d, "hourlyRevenueChartMax", "HourlyRevenueChartMax")) || 0;
      const max = hasHourlyData ? Math.max(maxReported, ...hourly, 0.01) : 1;
      const w = 640, h = 200, padL = 40, padR = 14, padT = 14, padB = 30;
      const innerW = w - padL - padR;
      const innerH = h - padT - padB;
      const yBase = h - padB;
      const gx = i => padL + (i / 23) * innerW;
      const gy = v => hasHourlyData ? padT + innerH * (1 - v / max) : yBase;
      let grid = "";
      for (let g = 0; g <= 4; g++) {
        const y = padT + (g / 4) * innerH;
        grid += "<line x1=\"" + padL + "\" y1=\"" + y.toFixed(1) + "\" x2=\"" + (w - padR) + "\" y2=\"" + y.toFixed(1) + "\" stroke=\"#2d3b50\" stroke-dasharray=\"5 6\" />";
      }
      const pts = hourly.map((v, i) => gx(i).toFixed(1) + "," + gy(v).toFixed(1)).join(" ");
      const xLast = gx(23).toFixed(1);
      const xFirst = gx(0).toFixed(1);
      const yBaseStr = yBase.toFixed(1);
      const areaPts = pts + " " + xLast + "," + yBaseStr + " " + xFirst + "," + yBaseStr;
      let hits = "";
      for (let hour = 0; hour < 24; hour++) {
        hits += "<rect class=\"chart-hit\" x=\"" + (gx(hour) - 13) + "\" y=\"" + padT + "\" width=\"26\" height=\"" + innerH + "\" data-hour=\"" + hour + "\" />";
      }
      const labs = [0, 4, 8, 12, 16, 20, 24].map(hr => {
        const x = hr >= 24 ? padL + innerW : gx(hr);
        return "<text x=\"" + x.toFixed(1) + "\" y=\"" + (h - 10) + "\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"11\" font-family=\"system-ui,sans-serif\">" + hr + "h</text>";
      }).join("");
      return (
        "<div class=\"chart-wrap-hourly\">" +

    function sparklineSvg(values) {
      if (!values || !values.length) return "";
      const w = 120, h = 28, pad = 2;
      const v = values.map(x => Math.max(0, Number(x) || 0));
      const max = Math.max(...v, 1);
      const pts = v.map((val, i) => {
        const x = pad + (v.length <= 1 ? 0 : (i / (v.length - 1)) * (w - 2 * pad));
        const y = pad + (h - 2 * pad) * (1 - val / max);
        return x.toFixed(1) + "," + y.toFixed(1);
      });
      return "<svg class=\"kpi-spark\" viewBox=\"0 0 " + w + " " + h + "\" preserveAspectRatio=\"none\"><polyline fill=\"none\" stroke=\"#3b82f6\" stroke-width=\"1.5\" points=\"" + pts.join(" ") + "\" /></svg>";
    }

      inventory: async (el) => {
        const r = await api("/api/admin/data/inventory", "GET", null, true);
        if (!r.ok) {
          el.innerHTML = "<div class='danger'>HTTP " + r.status + "</div>";
          return;
        }
        const hint = getNavFilter("inventory");
        if (hint) sessionStorage.removeItem(NAV_FILTER_KEY + ":inventory");

        let raw = normalizeAdminEntityItems(r.body).map(row => ({
          id: pick(row, "id", "Id"),
          name: String(pick(row, "name", "Name") ?? ""),
          uniqueId: String(pick(row, "uniqueId", "UniqueId") ?? ""),
          stockQuantity: Number(pick(row, "stockQuantity", "StockQuantity") ?? 0),
          unit: String(pick(row, "unit", "Unit") ?? ""),
          expirationDate: pick(row, "expirationDate", "ExpirationDate"),
          notes: String(pick(row, "notes", "Notes") ?? "")
        }));

        if (hint) {
          const q = hint.toLowerCase();
          raw = raw.filter(x =>
            (x.name + "\n" + x.uniqueId).toLowerCase().includes(q));
        }

        let sortInv = "exp";

        function expMeta(iso) {
          if (iso == null || iso === "") return { sortKey: 999999, label: t("invExpNoExpiry", "No expiry"), pct: 15, ok: true };
          const d = new Date(iso);
          if (Number.isNaN(d.getTime())) return { sortKey: 999998, label: "—", pct: 20, ok: true };
          const today = new Date();
          today.setHours(0, 0, 0, 0);
          const exp = new Date(d);
          exp.setHours(0, 0, 0, 0);
          const days = Math.round((exp - today) / 864e5);
          let label, ok, pct;
          if (days <= 0) { label = t("invExpExpired", "Expired · {{days}} day(s)", { days: days }); ok = false; pct = 100; }
          else if (days <= 7) { label = t("invExpCritical", "Critical · {{days}} day(s)", { days: days }); ok = false; pct = 88; }
          else if (days <= 14) { label = t("invExpBad", "Bad · {{days}} day(s)", { days: days }); ok = false; pct = 60; }
          else { label = t("invExpGood", "Good · {{days}} day(s)", { days: days }); ok = true; pct = Math.min(96, 28 + Math.min(days, 200) / 8); }
          return { sortKey: days, label, days, pct, ok };
        }

        function qtyLabel(qty) {
          if (qty <= 0) return t("invQtyOut", "Out");
          if (qty <= 3) return t("invQtyCritical", "Critical");
          if (qty <= 10) return t("invQtyLow", "Low");
          return t("invQtyHealthy", "Healthy");
        }

        el.innerHTML =
          "<div class=\"catalog-page\">" +
          "<header class=\"catalog-header\">" +
          "<div><h1 class=\"catalog-page-title\">" + esc(t("invTitle", "Inventory items")) + "</h1>" +
         (hint ? "<p class=\"muted\" style=\"margin:8px 0 0;\">" + esc(t("filteredFromDashboard", "Filtered from dashboard: \"{{hint}}\" · {{count}} row(s).", { hint: hint, count: raw.length })) + "</p>" : "") +
          "</div>" +
          "<div class=\"catalog-actions\">" +
          "<button type=\"button\" class=\"pill-btn\" id=\"invSortExp\">" + esc(t("invSortExp", "By expiration")) + "</button>" +
          "<button type=\"button\" class=\"pill-btn\" id=\"invSortQty\">" + esc(t("invSortQty", "By quantity")) + "</button>" +
          "<span class=\"read-only-pill\">" + esc(t("readOnlyWeb", "Read-only web")) + "</span></div></header>" +
          "<input type=\"search\" class=\"catalog-search\" id=\"invSearch\" placeholder=\"" + escAttr(t("invSearch", "Search inventory…")) + "\" autocomplete=\"off\">" +
          "<div class=\"catalog-list\" id=\"invCatalogList\"></div></div>" +
          "<div id=\"invDetailModal\" class=\"modal-backdrop hidden\">" +
          "<div class=\"modal-card-admin\">" +
          "<h3 id=\"invDetailTitle\">" + esc(t("invItem", "Item")) + "</h3>" +
          "<pre id=\"invDetailBody\"></pre>" +
          "<button type=\"button\" class=\"btn btn-ghost\" id=\"invDetailClose\">" + esc(t("close", "Close")) + "</button>" +
          "</div></div>";

        function paintInv() {
          const needle = ($("invSearch").value || "").trim().toLowerCase();
          let rows = !needle
            ? raw.slice()
            : raw.filter(x =>
              (x.name + "\n" + x.uniqueId + "\n" + x.unit + "\n" + x.notes).toLowerCase().includes(needle));
          if (sortInv === "exp") {
            rows.sort((a, b) => expMeta(a.expirationDate).sortKey - expMeta(b.expirationDate).sortKey);
          } else {
            rows.sort((a, b) => a.stockQuantity - b.stockQuantity || a.name.localeCompare(b.name, undefined, { sensitivity: "base" }));
          }
          const list = $("invCatalogList");
          if (!rows.length) {
            list.innerHTML = "<p class=\"muted\">" + esc(t("invNoMatch", "No inventory rows match.")) + "</p>";
            return;
          }
          list.innerHTML = rows.map(it => {
            const em = expMeta(it.expirationDate);
            let expDateStr = "—";
            if (it.expirationDate) {
              const rawD = it.expirationDate;
              expDateStr = typeof rawD === "string" ? rawD.slice(0, 10) : new Date(rawD).toISOString().slice(0, 10);
            }
            const qLab = qtyLabel(it.stockQuantity);
            return (
              "<article class=\"inv-card\" data-inv-id=\"" + it.id + "\">" +
              "<div class=\"inv-card-top\">" +
              "<div>" +
              "<h2 class=\"inv-name\">" + esc(it.name) + "</h2>" +
              "<div class=\"inv-id\">" + esc(it.uniqueId) + "</div>" +
              "<div class=\"inv-stock\">" + esc(t("invStock", "Stock")) + ": " + esc(String(it.stockQuantity)) + " " + esc(it.unit) +
              " · <span class=\"muted\">" + esc(qLab) + "</span></div>" +
              "<div class=\"inv-exp-line\">" + esc(t("invExpires", "Expires")) + ": " + esc(expDateStr) + "</div>" +
              "</div>" +
              "<div class=\"inv-actions\">" +
              "<button type=\"button\" class=\"btn btn-ghost btn-sm js-inv-detail\">" + esc(t("details", "Details")) + "</button>" +
              "</div></div>" +
              "<div class=\"inv-status-row\">" +
              "<span class=\"muted\" style=\"font-size:14px;\" aria-hidden=\"true\">⏳</span>" +
              "<div class=\"inv-bar-wrap\"><div class=\"inv-bar " + (em.ok ? "ok" : "bad") + "\" style=\"width:" + em.pct.toFixed(1) + "%\"></div></div>" +
              "<span class=\"muted\" style=\"font-size:13px;\">" + esc(em.label) + "</span>" +
              "</div>" +
              "<div class=\"inv-log\">" + esc(it.notes ? translateInventoryNotes(it.notes) : t("invNoNotes", "No notes on file. Full stock activity history is in Elite Pro.")) + "</div>" +
              "</article>");
          }).join("");

          list.querySelectorAll(".js-inv-detail").forEach(btn => {
            btn.addEventListener("click", e => {
              e.stopPropagation();
              const card = btn.closest(".inv-card");
              const id = Number(card.getAttribute("data-inv-id"));
              const it = raw.find(x => x.id === id);
              if (!it) return;
              const em = expMeta(it.expirationDate);
              $("invDetailTitle").textContent = it.name;
              $("invDetailBody").textContent =
                t("invDetailId", "ID") + ": " + it.uniqueId + "\n" + t("invStock", "Stock") + ": " + it.stockQuantity + " " + it.unit + " (" + qtyLabel(it.stockQuantity) + ")\n" +
                t("invDetailExpiration", "Expiration") + ": " + (it.expirationDate || "—") + "\n" + t("invDetailShelfStatus", "Shelf status") + ": " + em.label + "\n\n" + t("invDetailNotes", "Notes") + ":\n" + (it.notes ? translateInventoryNotes(it.notes) : "—");
              $("invDetailModal").classList.remove("hidden");
            });
          });
        }

        $("invSortExp").addEventListener("click", () => { sortInv = "exp"; paintInv(); });
        $("invSortQty").addEventListener("click", () => { sortInv = "qty"; paintInv(); });
        $("invSearch").addEventListener("input", paintInv);
        $("invDetailClose").addEventListener("click", () => $("invDetailModal").classList.add("hidden"));
        $("invDetailModal").addEventListener("click", e => {
          if (e.target.id === "invDetailModal") $("invDetailModal").classList.add("hidden");
        });

        paintInv();
      },

        const byProd = {};

        for (const row of piList) {
          const pid = row.productId ?? row.ProductId;
          const iid = row.inventoryItemId ?? row.InventoryItemId;
          const qn = Number(row.quantity ?? row.Quantity ?? 0);
          if (!byProd[pid]) byProd[pid] = [];
          const inv = invById[iid];
          const nm = inv ? inv.name : ("#" + iid);
          const un = inv ? inv.unit : "";
          byProd[pid].push({ name: nm, qty: qn, unit: un });
        }

        function normMenuCat(s) {
          const val = String(s ?? "").trim();
          return val || t("menuUncategorized", "Uncategorized");
        }
        function normMenuSub(s) {
          const val = String(s ?? "").trim();
          return val || t("menuGeneral", "General");
        }

        let raw = normalizeAdminEntityItems(r.body).map(row => {
          const id = pick(row, "id", "Id");
          return {
            id: id,
            name: String(pick(row, "name", "Name") ?? ""),
            category: normMenuCat(pick(row, "category", "Category")),
            subCategory: normMenuSub(pick(row, "subCategory", "SubCategory")),
            price: Number(pick(row, "price", "Price") ?? 0),
            uniqueId: String(pick(row, "uniqueId", "UniqueId") ?? ""),
            description: String(pick(row, "description", "Description") ?? ""),
            composition: String(pick(row, "composition", "Composition") ?? ""),
            photoUrl: photoById[id] || ""
          };
        });

        if (hint) {
          const q = hint.toLowerCase();
          raw = raw.filter(x =>
            (x.name + "\n" + x.uniqueId + "\n" + x.category + "\n" + x.subCategory + "\n" + x.description + "\n" + x.composition).toLowerCase().includes(q));
        }

        function ingHtmlForProduct(p) {
          const lines = [];
          const parts = byProd[p.id] || [];
          for (const x of parts) {
            const q = x.qty ? String(x.qty) : "";
            const u = x.unit ? " " + x.unit : "";
            lines.push("<li>" + esc(x.name) + (q ? " " + q + u : "") + "</li>");
          }
          if (!lines.length && p.composition) {
            const bits = String(p.composition).split(/[,;]/).map(s => s.trim()).filter(Boolean);
            for (const b of bits) lines.push("<li>" + esc(b) + "</li>");
          }
          if (!lines.length)
            return "<ul class=\"menu-prod-ing\"><li>" + esc(t("menuNoIngredients", "No ingredient breakdown")) + "</li></ul>";
          return "<ul class=\"menu-prod-ing\">" + lines.join("") + "</ul>";
        }

        let sortMenu = "name";

        el.innerHTML =
          "<div class=\"catalog-page\">" +
          "<header class=\"catalog-header\">" +
          "<div>" +
          "<h1 class=\"catalog-page-title\">" + esc(t("menuTitle", "Menu Products")) + "</h1>" +
          (hint ? "<p class=\"muted\" style=\"margin:10px 0 0;\">" + esc(t("filteredFromDashboard", "Filtered from dashboard: \"{{hint}}\" · {{count}} row(s).", { hint: hint, count: raw.length })) + "</p>" : "") +
          "</div>" +
          "<div class=\"catalog-actions\">" +
          "<button type=\"button\" class=\"pill-btn\" id=\"menuSortName\">" + esc(t("menuSortName", "By name")) + "</button>" +
          "<button type=\"button\" class=\"pill-btn\" id=\"menuSortPriceHi\">" + esc(t("menuSortPriceHi", "Price · high")) + "</button>" +
          "<button type=\"button\" class=\"pill-btn\" id=\"menuSortPriceLo\">" + esc(t("menuSortPriceLo", "Price · low")) + "</button>" +
          "<span class=\"read-only-pill\">" + esc(t("readOnlyWeb", "Read-only web")) + "</span></div></header>" +
          "<div class=\"menu-filter-panel\">" +
          "<div class=\"menu-filter-row\">" +
          "<div><label class=\"menu-lbl\" for=\"menuCatSel\">" + esc(t("menuType", "Menu type")) + "</label>" +
          "<select class=\"menu-filter-select\" id=\"menuCatSel\"></select></div>" +
          "<div><label class=\"menu-lbl\" for=\"menuSubSel\">" + esc(t("menuSubtype", "Submenu type")) + "</label>" +
          "<select class=\"menu-filter-select\" id=\"menuSubSel\"></select></div></div>" +
          "<label class=\"menu-lbl\" for=\"menuAdminSearch\">" + esc(t("menuSearchLabel", "Search by name")) + "</label>" +
          "<input type=\"search\" class=\"catalog-search\" id=\"menuAdminSearch\" placeholder=\"" + escAttr(t("menuSearch", "Search products…")) + "\" autocomplete=\"off\">" +
          "</div>" +
          "<div id=\"menuAdminList\"></div></div>";

        function allCategories() {
          return [...new Set(raw.map(p => p.category))].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" }));
        }
        function subsForCat(catVal) {
          const set = new Set();
          for (const p of raw) {
            if (catVal === "__all__" || p.category === catVal) set.add(p.subCategory);
          }
          return [...set].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" }));
        }

        function syncSelectors() {
          const catSel = $("menuCatSel");
          const subSel = $("menuSubSel");
          const cats = allCategories();
          const prevC = catSel.value;
          catSel.innerHTML = "<option value=\"__all__\">" + esc(t("menuAllTypes", "All types")) + "</option>" +
            cats.map(c => "<option value=\"" + esc(c) + "\">" + esc(c) + "</option>").join("");
          catSel.value = (prevC && (prevC === "__all__" || cats.includes(prevC))) ? prevC : "__all__";
          const c = catSel.value;
          const subs = subsForCat(c);
          const prevS = subSel.value;
          subSel.innerHTML = "<option value=\"__all__\">" + esc(t("menuAllSubtypes", "All subtypes")) + "</option>" +
            subs.map(s => "<option value=\"" + esc(s) + "\">" + esc(s) + "</option>").join("");
          subSel.value = (prevS && (prevS === "__all__" || subs.includes(prevS))) ? prevS : "__all__";
        }

        function applySort(rows) {
          const out = rows.slice();
          if (sortMenu === "name") {
            out.sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: "base" }));
          } else if (sortMenu === "priceHi") {
            out.sort((a, b) => b.price - a.price || a.name.localeCompare(b.name, undefined, { sensitivity: "base" }));
          } else if (sortMenu === "priceLo") {
            out.sort((a, b) => a.price - b.price || a.name.localeCompare(b.name, undefined, { sensitivity: "base" }));
          }
          return out;
        }

        function paintMenu() {
          const needle = ($("menuAdminSearch").value || "").trim().toLowerCase();
          const catF = $("menuCatSel").value;
          const subF = $("menuSubSel").value;
          let rows = raw.filter(p => {
            if (catF !== "__all__" && p.category !== catF) return false;
            if (subF !== "__all__" && p.subCategory !== subF) return false;
            if (!needle) return true;
            return (p.name + "\n" + p.uniqueId + "\n" + p.description + "\n" + p.composition).toLowerCase().includes(needle);
          });
          rows = applySort(rows);
          const list = $("menuAdminList");
          if (!rows.length) {
            list.innerHTML = "<p class=\"muted\">" + esc(t("menuNoMatch", "No products match your search.")) + "</p>";
            return;
          }
          const byCat = {};
          for (const p of rows) {
            if (!byCat[p.category]) byCat[p.category] = {};
            if (!byCat[p.category][p.subCategory]) byCat[p.category][p.subCategory] = [];
            byCat[p.category][p.subCategory].push(p);
          }
          const catKeys = Object.keys(byCat).sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" }));
          let html = "";
          for (const c of catKeys) {
            html += "<h2 class=\"menu-cat-title\">" + esc(c) + "</h2>";
            const subs = Object.keys(byCat[c]).sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" }));
            for (const s of subs) {
              const showSubHeading = subs.length > 1 || s !== t("menuGeneral", "General");
              if (showSubHeading) html += "<h3 class=\"menu-sub-title\">" + esc(s) + "</h3>";
              html += "<div class=\"menu-prod-grid\">";
              for (const p of byCat[c][s]) {
                const imgUrl = p.photoUrl || "";
                const thumb = imgUrl
                  ? ("<img src=\"" + esc(imgUrl) + "\" alt=\"\" loading=\"lazy\" " +
                     "onerror=\"this.remove();var ph=this.parentNode.querySelector('.menu-prod-thumb-ph');if(ph){ph.style.display='flex';}\">" +
                     "<div class=\"menu-prod-thumb-ph\" style=\"display:none\" aria-hidden=\"true\">🍽</div>")
                  : "<div class=\"menu-prod-thumb-ph\" aria-hidden=\"true\">🍽</div>";
                html +=
                  "<article class=\"menu-prod-card\">" +
                  "<div class=\"menu-prod-thumb\">" + thumb + "</div>" +
                  "<div class=\"menu-prod-body\">" +
                  "<div class=\"menu-prod-name\">" + esc(p.name) + "</div>" +
                  "<div class=\"menu-prod-id mono\">" + esc(p.uniqueId) + "</div>" +
                  "<div class=\"menu-prod-price\">" + esc(fmtMenuMoney(p.price)) + "</div>" +
                  ingHtmlForProduct(p) +
                  "</div></article>";
              }
              html += "</div>";
            }
          }
          list.innerHTML = html;
        }

        syncSelectors();
        $("menuCatSel").addEventListener("change", () => { syncSelectors(); paintMenu(); });
        $("menuSubSel").addEventListener("change", paintMenu);
        $("menuSortName").addEventListener("click", () => { sortMenu = "name"; paintMenu(); });
        $("menuSortPriceHi").addEventListener("click", () => { sortMenu = "priceHi"; paintMenu(); });
        $("menuSortPriceLo").addEventListener("click", () => { sortMenu = "priceLo"; paintMenu(); });
        $("menuAdminSearch").addEventListener("input", paintMenu);
        paintMenu();
      },
