<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elite Reception</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0b0e14;
      --navy-elev: #121722;
      --surface: #161c28;
      --surface-hover: #1c2433;
      --cream: #f7f5f0;
      --amber: #e8a838;
      --amber-dim: #c98f2a;
      --text-dark: #e8eaef;
      --text-muted: #8b93a7;
      --border: rgba(255, 255, 255, 0.08);
      --accent-blue: #38bdf8;
      --accent-rose: #fb7185;
      --accent-violet: #a78bfa;
      --accent-teal: #2dd4bf;
      --accent-lime: #a3e635;
      --radius: 14px;
      --radius-sm: 10px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, Segoe UI, sans-serif;
      background: var(--navy);
      color: #e8eef4;
    }
    .layout { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; height: 100vh; overflow: hidden; }
    .sidebar {
      border-right: 1px solid #1e293b;
      background: var(--navy);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
      overflow-y: auto;
    }
    .brand { font-weight: 700; font-size: 15px; letter-spacing: 0.04em; color: var(--amber); }
    .brand-logo { width: 100%; max-height: 72px; object-fit: contain; border-radius: 8px; background: #111923; display: none; }
    .brand-logo.show { display: block; }
    .nav-btn {
      width: 100%; text-align: left; padding: 12px 14px; min-height: 44px;
      border: none; border-radius: var(--radius); border-left: 3px solid transparent;
      background: transparent; color: #6b7280; cursor: pointer; font-family: inherit; font-size: 14px;
    }
    .nav-btn:hover { color: #d1d5db; background: rgba(255,255,255,0.04); }
    .nav-btn.active { border-left-color: var(--amber); background: rgba(245,158,11,0.1); color: #fff; font-weight: 600; }
    .who { margin-top: auto; border-top: 1px solid #334155; padding-top: 12px; font-size: 12px; color: #94a3b8; }
    .who-photo { width: 40px; height: 40px; border-radius: 999px; object-fit: cover; border: 1px solid #475569; display: none; }
    .who-photo.show { display: block; }
    .who-row { display: flex; align-items: center; gap: 10px; }
    #sessionLabel { font-weight: 600; color: #d1d5db; font-size: 13px; word-break: break-word; }
    .staff-role-chip {
      font-size: 0.68rem; background: #374151; color: #9ca3af; padding: 2px 8px; border-radius: 4px;
      text-transform: uppercase; letter-spacing: 0.06em; display: inline-block; margin-top: 6px;
    }
    #app .main-area {
      padding: 16px 18px 24px;
      min-height: 0;
      height: 100%;
      align-self: stretch;
      background: linear-gradient(165deg, var(--navy) 0%, #0d1219 45%, #0a0d12 100%);
      color: var(--text-dark);
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow: hidden;
    }
    #loginWrap.main-area {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--navy);
    }
    #loginWrap .card {
      max-width: 420px; width: 100%;
      border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface);
      padding: 22px; color: var(--text-dark);
      box-shadow: 0 24px 60px rgba(0,0,0,0.45);
    }
    #loginWrap h1 { margin: 0 0 12px; font-size: 1.35rem; color: var(--text-dark); }
    #loginWrap .login-stack { display: flex; flex-direction: column; gap: 14px; margin-top: 4px; }
    #loginWrap #btnLogin { margin-top: 18px; }
    #loginWrap .login-stack .login-field { display: flex; flex-direction: column; gap: 0; }
    label.lbl { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: var(--text-muted); margin-bottom: 6px; }
    input.inp, select.sel, textarea.txa {
      width: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-family: inherit; font-size: 15px; background: var(--navy-elev); color: var(--text-dark);
    }
    textarea.txa { min-height: 72px; resize: vertical; }
    .btn {
      min-height: 44px; padding: 0 16px; border-radius: var(--radius); font-family: inherit; font-weight: 600;
      font-size: 14px; cursor: pointer; border: none;
    }
    .btn-primary { background: linear-gradient(135deg, var(--amber), var(--amber-dim)); color: #0a0c10; box-shadow: 0 4px 14px rgba(232, 168, 56, 0.25); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-ghost { background: var(--surface); color: var(--text-dark); border: 1px solid var(--border); }
    .btn-sm { min-height: 36px; padding: 0 12px; font-size: 13px; }
    .btn-danger { background: rgba(127, 29, 29, 0.35); color: #fecaca; border: 1px solid rgba(248, 113, 113, 0.4); }
    .btn-block { width: 100%; }
    .hidden { display: none !important; }
    .muted { color: var(--text-muted); font-size: 12px; }
    .danger { color: #fecaca; background: rgba(127, 29, 29, 0.35); border: 1px solid rgba(248, 113, 113, 0.35); padding: 10px 12px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 12px; }
    .muted.ok { color: #6ee7b7; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .toolbar-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: flex-end; flex: 1; min-width: 200px; }
    .toolbar h2 { margin: 0; font-size: 1.2rem; font-weight: 700; letter-spacing: -0.02em; }
    .hub-pill {
      font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em;
      padding: 4px 10px; border-radius: 999px; font-weight: 600;
    }
    .hub-pill.ok { background: rgba(45, 212, 191, 0.2); color: #5eead4; border: 1px solid rgba(45, 212, 191, 0.35); }
    .hub-pill.warn { background: rgba(232, 168, 56, 0.18); color: #fbbf24; border: 1px solid rgba(232, 168, 56, 0.35); }
    .hub-pill.off { background: var(--surface); color: var(--text-muted); border: 1px solid var(--border); }
    .view-panel { flex: 1; display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow: hidden; }
    .nav-stack { display: flex; flex-direction: column; gap: 6px; }
    .card-panel {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.2);
    }
    .card-panel h3 { margin: 0 0 10px; font-size: 0.95rem; font-weight: 600; color: #cbd5e1; }
    .row-flex { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .grow { flex: 1; min-width: 140px; }
    @media (max-width: 1000px) {
      .layout { grid-template-columns: 1fr; height: auto; min-height: 100vh; overflow: visible; }
      .sidebar { flex-direction: row; flex-wrap: wrap; border-right: none; border-bottom: 1px solid #1e293b; }
      .who { width: 100%; }
      #app .main-area { height: auto; overflow: visible; }
    }
    .list-scroll {
      flex: 1; overflow-y: auto; min-height: 0;
      border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--navy-elev);
    }
    #viewOrders .orders-pending-panel {
      flex: 0 1 auto;
      max-height: min(28vh, 220px);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    #viewOrders .orders-pending-panel .list-scroll { max-height: none; }
    .orders-split {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      align-items: stretch;
    }
    .orders-split .card-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      flex: 1;
    }
    .orders-split .list-scroll { min-height: 0; }
    .product-row, .cart-row {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 13px;
    }
    button.product-row {
      width: 100%; text-align: left; font-family: inherit; font-size: inherit;
      background: transparent; border: none; color: inherit; cursor: pointer;
      border-radius: var(--radius-sm); margin: 2px 0;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    button.product-row:hover { background: var(--surface-hover); }
    button.product-row:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
    .product-row--disabled { opacity: 0.45; cursor: not-allowed; }
    .order-card {
      border-bottom: 1px solid var(--border); font-size: 13px; background: transparent;
    }
    button.order-card__hit {
      width: 100%; display: block; text-align: left; padding: 12px 14px 4px;
      border: none; background: transparent; color: inherit; cursor: pointer; font-family: inherit; font-size: inherit;
    }
    button.order-card__hit:hover { background: var(--surface-hover); }
    button.order-card__hit:focus-visible { outline: 2px solid var(--accent-blue); outline-offset: -2px; }
    .order-card__actions {
      display: flex; flex-wrap: wrap; gap: 8px; padding: 0 14px 12px;
    }
    .list-scroll.res-booking-list {
      border: none;
      background: transparent;
      padding: 4px 2px 12px;
    }
    .res-eng-card {
      margin-bottom: 12px;
      border-radius: 16px;
      border: 1px solid rgba(232, 168, 56, 0.14);
      background: linear-gradient(145deg, rgba(22, 28, 40, 0.95) 0%, rgba(14, 18, 28, 0.98) 100%);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      overflow: hidden;
      transition: transform 0.14s ease, box-shadow 0.14s ease, border-color 0.14s ease;
    }
    .res-eng-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(232, 168, 56, 0.12);
      border-color: rgba(232, 168, 56, 0.28);
    }
    button.res-eng-card__hit {
      width: 100%;
      display: flex;
      gap: 0;
      text-align: left;
      padding: 0;
      border: none;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font-family: inherit;
      -webkit-appearance: none;
      appearance: none;
    }
    /* Native <button> hover is light blue; override so text stays readable on dark cards */
    button.res-eng-card__hit:hover {
      background: var(--surface-hover);
    }
    button.res-eng-card__hit:active {
      background: rgba(28, 36, 51, 0.95);
    }
    button.res-eng-card__hit:focus-visible {
      outline: 2px solid var(--amber);
      outline-offset: 2px;
    }
    .res-eng-card__rail {
      width: 4px;
      flex-shrink: 0;
      background: linear-gradient(180deg, var(--amber) 0%, rgba(232, 168, 56, 0.35) 100%);
    }
    .res-eng-card__rail--in { background: linear-gradient(180deg, var(--accent-teal) 0%, rgba(45, 212, 191, 0.35) 100%); }
    .res-eng-card__body { flex: 1; padding: 14px 16px 16px; min-width: 0; }
    .res-eng-card__top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .res-eng-card__name { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.02em; color: #f1f5f9; }
    .res-eng-card__ref { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.06em; color: var(--amber); text-transform: uppercase; }
    .res-pill {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      white-space: nowrap;
    }
    .res-pill--scheduled { color: #fde68a; background: rgba(232, 168, 56, 0.14); border-color: rgba(232, 168, 56, 0.35); }
    .res-pill--in { color: #5eead4; background: rgba(45, 212, 191, 0.12); border-color: rgba(45, 212, 191, 0.35); }
    .res-pill--muted { color: var(--text-muted); background: rgba(255, 255, 255, 0.04); }
    .res-eng-card__when {
      margin-top: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #e2e8f0;
      letter-spacing: -0.01em;
    }
    .res-eng-card__chips {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .res-chip {
      font-size: 0.72rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 999px;
    }
    .res-chip strong { color: #cbd5e1; font-weight: 600; }
    .res-empty {
      text-align: center;
      padding: 36px 20px 28px;
      border-radius: 16px;
      border: 1px dashed rgba(232, 168, 56, 0.2);
      background: rgba(0, 0, 0, 0.15);
    }
    .res-empty-title { margin: 0; font-size: 1rem; font-weight: 600; color: #e2e8f0; }
    .res-empty-hint { margin: 10px 0 0; font-size: 0.82rem; line-height: 1.5; color: var(--text-muted); max-width: 320px; margin-left: auto; margin-right: auto; }
    .modal-card.res-detail-modal {
      max-width: 440px;
      padding: 0;
      overflow: hidden;
      border: 1px solid rgba(232, 168, 56, 0.18);
      background: linear-gradient(165deg, #151b27 0%, #10151e 100%);
    }
    .res-detail-hero {
      padding: 22px 22px 18px;
      background: radial-gradient(120% 90% at 10% 0%, rgba(232, 168, 56, 0.12) 0%, transparent 55%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0%, transparent 100%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .res-modal-title {
      margin: 0;
      font-family: "Playfair Display", Georgia, serif;
      font-style: italic;
      font-weight: 600;
      font-size: 1.45rem;
      line-height: 1.2;
      color: #f8fafc;
    }
    .res-detail-meta {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    .res-ref--internal {
      margin-left: 10px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #64748b;
      text-transform: none;
    }
    .res-ref {
      font-family: ui-monospace, monospace;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--amber);
    }
    .res-detail-body-scroll {
      padding: 16px 22px 8px;
      max-height: min(52vh, 380px);
      overflow-y: auto;
    }
    .res-detail-section { margin-bottom: 18px; }
    .res-detail-section-title {
      margin: 0 0 10px;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--amber);
      opacity: 0.85;
    }
    .res-kv-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .res-kv {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      background: rgba(0, 0, 0, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .res-kv-lbl { font-size: 0.65rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); }
    .res-kv-val { font-size: 0.88rem; color: #e2e8f0; font-weight: 500; line-height: 1.35; word-break: break-word; }
    .res-action-bar {
      padding: 14px 22px 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(0, 0, 0, 0.2);
    }
    .res-action-bar .row-flex { gap: 8px; }
    #reschedulePanel.res-resched-panel {
      margin: 0 22px 16px;
      padding: 14px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(232, 168, 56, 0.2);
      background: rgba(232, 168, 56, 0.06);
    }
    .res-detail-footer {
      padding: 0 22px 18px;
      display: flex;
      justify-content: flex-end;
    }
    .list-scroll.tbl-table-list {
      border: none;
      background: transparent;
      padding: 4px 2px 12px;
    }
    .tbl-card {
      margin-bottom: 12px;
      border-radius: 16px;
      border: 1px solid rgba(232, 168, 56, 0.14);
      background: linear-gradient(145deg, rgba(22, 28, 40, 0.95) 0%, rgba(14, 18, 28, 0.98) 100%);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      overflow: hidden;
      transition: transform 0.14s ease, box-shadow 0.14s ease, border-color 0.14s ease;
    }
    .tbl-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(232, 168, 56, 0.12);
      border-color: rgba(232, 168, 56, 0.28);
    }
    button.tbl-card__hit {
      width: 100%;
      display: flex;
      gap: 0;
      text-align: left;
      padding: 0;
      border: none;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font-family: inherit;
      -webkit-appearance: none;
      appearance: none;
    }
    button.tbl-card__hit:hover { background: var(--surface-hover); }
    button.tbl-card__hit:active { background: rgba(28, 36, 51, 0.95); }
    button.tbl-card__hit:focus-visible {
      outline: 2px solid var(--amber);
      outline-offset: 2px;
    }
    .tbl-card__rail {
      width: 4px;
      flex-shrink: 0;
      background: linear-gradient(180deg, var(--amber) 0%, rgba(232, 168, 56, 0.35) 100%);
    }
    .tbl-card__rail--available {
      background: linear-gradient(180deg, var(--accent-teal) 0%, rgba(45, 212, 191, 0.35) 100%);
    }
    .tbl-card__body {
      flex: 1;
      padding: 14px 16px 16px;
      min-width: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .tbl-card__main { min-width: 0; flex: 1; }
    .tbl-card__num {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #f1f5f9;
    }
    .tbl-card__name {
      margin-top: 4px;
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.35;
    }
    .tbl-card__server {
      margin-top: 10px;
      font-size: 0.72rem;
      color: var(--text-muted);
    }
    .tbl-card__server strong {
      color: #94a3b8;
      font-weight: 600;
    }
    .tbl-avail-pill {
      flex-shrink: 0;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      line-height: 1.1;
      white-space: nowrap;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }
    .tbl-avail-pill--occupied {
      color: #fde68a;
      background: rgba(232, 168, 56, 0.2);
      border-color: rgba(232, 168, 56, 0.45);
    }
    .tbl-avail-pill--available {
      color: #5eead4;
      background: rgba(45, 212, 191, 0.16);
      border-color: rgba(45, 212, 191, 0.4);
    }
    .tbl-avail-pill--other {
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--border);
    }
    .modal-card.tbl-detail-modal {
      max-width: 460px;
      padding: 0;
      overflow: hidden;
      border: 1px solid rgba(232, 168, 56, 0.18);
      background: linear-gradient(165deg, #151b27 0%, #10151e 100%);
    }
    .tbl-detail-hero .tbl-avail-pill {
      font-size: 0.72rem;
      padding: 8px 14px;
    }
    .tbl-detail-meta {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    .tbl-ref {
      font-family: ui-monospace, monospace;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--amber);
    }
    .tbl-open-checks-loading {
      font-size: 0.82rem;
      color: var(--text-muted);
      padding: 8px 0;
    }
    .tbl-open-check {
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      background: rgba(0, 0, 0, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.06);
      margin-bottom: 8px;
    }
    .tbl-open-check:last-child { margin-bottom: 0; }
    .tbl-open-check__top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #e2e8f0;
    }
    .tbl-open-check__meta {
      margin-top: 6px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .tbl-open-check__lines {
      margin-top: 6px;
      font-size: 0.8rem;
      color: #94a3b8;
      line-height: 1.4;
    }
    .tbl-guest-link {
      display: block;
      margin-top: 6px;
      font-size: 0.8rem;
      color: var(--accent-blue);
      word-break: break-all;

      <div class="login-stack">
        <div class="login-field">
          <label class="lbl" for="staffId">Sign-in ID</label>
          <input class="inp" id="staffId" type="text" autocomplete="username">
        </div>
        <div class="login-field">
          <label class="lbl" for="pin">PIN</label>
          <input class="inp" id="pin" type="password" autocomplete="current-password">
        </div>
        <button type="button" class="btn btn-primary btn-block" id="btnLogin">Sign in</button>
      </div>
    </div>
  </div>

  <div id="app" class="layout hidden">
    <aside class="sidebar">
      <div>
        <img id="brandLogo" class="brand-logo" alt="">
        <div class="brand" id="brandText">ELITE RECEPTION</div>
      </div>
      <div class="nav-stack">
        <button type="button" class="nav-btn active" id="navTableMenu" data-view="tableMenu">Table</button>
        <button type="button" class="nav-btn" id="navRes" data-view="reservations">Reservation</button>
        <button type="button" class="nav-btn" id="navDelivery" data-view="deliveryPickup">Delivery / Pickup <span id="navDeliveryBadge" class="nav-badge hidden" aria-hidden="true"></span></button>
        <button type="button" class="nav-btn" id="navMenu" data-view="menu">Menu</button>
      </div>
      <div class="row-flex" style="margin-top:4px;">
        <span id="hubPill" class="hub-pill off">Live: …</span>
        <span id="deliveryReadyFlash" class="muted" style="margin-left:8px;font-weight:600;color:#4ade80;flex:1;min-height:1.2em;"></span>
      </div>
      <div class="who">
        <div class="who-row">
          <img id="staffPhoto" class="who-photo" alt="">
          <div>
            <div id="sessionLabel" class="mono"></div>
            <span class="staff-role-chip">Reception</span>
          </div>
        </div>
        <button type="button" class="btn btn-ghost btn-block" id="btnLogout" style="margin-top:12px;">Sign out</button>
      </div>
    </aside>

    <main class="main-area">
      <div id="viewTableMenu" class="view-panel">
        <div class="toolbar">
          <h2>Table</h2>
          <button type="button" class="btn btn-ghost" id="btnRefreshTableMenu">Refresh tables</button>
        </div>
        <div class="card-panel table-menu-fill">
          <div id="tableMenuList" class="list-scroll tbl-table-list"></div>
        </div>
      </div>

      <div id="viewMenu" class="view-panel hidden">
        <div class="toolbar">
          <h2>Menu</h2>
          <div class="toolbar-row">
            <input type="search" id="menuSearch" class="search-field" placeholder="Search menu…" autocomplete="off">
            <button type="button" class="btn btn-ghost" id="btnRefreshMenu">Refresh</button>
          </div>
        </div>
        <div id="menuBody" class="menu-list"></div>
      </div>

      <div id="viewReservations" class="view-panel hidden">
        <div class="toolbar">
          <h2>Reservation</h2>
          <div class="toolbar-row">
            <button type="button" class="btn btn-primary btn-sm" id="btnOpenCreateReservation">Create reservation</button>
            <button type="button" class="btn btn-ghost" id="btnRefreshRes">Refresh</button>
          </div>
        </div>
        <div class="card-panel res-list-fill">
          <div id="reservationsList" class="list-scroll res-booking-list"></div>
        </div>
      </div>

      <div id="viewDeliveryPickup" class="view-panel hidden">
        <div class="toolbar">
          <h2>Delivery / Pickup</h2>
          <button type="button" class="btn btn-ghost" id="btnRefreshDelivery">Refresh</button>
        </div>
        <div id="dpReadyBanner" class="dp-ready-banner hidden" role="status"></div>
        <div class="card-panel res-list-fill">
          <div id="deliveryPickupList" class="list-scroll"></div>
        </div>
      </div>
    </main>
  </div>

  <div id="resCreateModal" class="modal-backdrop hidden" role="presentation">
    <div class="modal-card res-create-modal" role="dialog" aria-modal="true" aria-labelledby="resCreateModalTitle">
      <div class="res-detail-hero">
        <h3 id="resCreateModalTitle" class="res-modal-title">New reservation</h3>
      </div>
      <div class="res-create-body">
        <div class="res-create-grid">
          <div>
            <label class="lbl" for="resCreateName">Guest name</label>
            <input class="inp" id="resCreateName" type="text" autocomplete="name" required>
          </div>
          <div>
            <label class="lbl" for="resCreatePhone">Phone</label>
            <input class="inp" id="resCreatePhone" type="tel" autocomplete="tel" required>
          </div>
          <div>
            <label class="lbl" for="resCreateEmail">Email <span class="muted" style="letter-spacing:0;font-weight:400;text-transform:none;">(optional)</span></label>
            <input class="inp" id="resCreateEmail" type="email" autocomplete="email">
          </div>
          <div>
            <label class="lbl" for="resCreateParty">Party size</label>
            <input class="inp" id="resCreateParty" type="number" min="1" max="99" value="2" required>
          </div>
          <div>
            <label class="lbl" for="resCreateWhen">Date &amp; time</label>
            <input class="inp" id="resCreateWhen" type="datetime-local" required>
            <div id="resCreateSlotsWrap" class="hidden" style="margin-top:8px;">
              <p class="muted" style="margin:0 0 6px;font-size:0.72rem;">Open slots for selected table</p>
              <div id="resCreateSlots" class="row-flex" style="gap:6px;flex-wrap:wrap;"></div>
            </div>
          </div>
          <div>
            <label class="lbl" for="resCreateTable">Table (optional)</label>
            <select class="sel" id="resCreateTable"><option value="">No table assigned</option></select>
            <p id="resCreateTableHint" class="muted" style="margin:6px 0 0;font-size:0.72rem;line-height:1.4;"></p>
          </div>
          <div class="full">
            <label class="lbl" for="resCreateNotes">Notes</label>
            <textarea class="txa" id="resCreateNotes" rows="2" placeholder="Allergies, occasion, seating preference…"></textarea>
          </div>
        </div>
      </div>
      <div class="res-create-footer">
        <span id="resCreateMsg" class="muted"></span>
        <button type="button" class="btn btn-ghost btn-sm" id="btnResCreateCancel">Cancel</button>
        <button type="button" class="btn btn-primary btn-sm" id="btnCreateReservation">Create reservation</button>
      </div>
    </div>
  </div>

  <div id="tableDetailModal" class="modal-backdrop hidden" role="presentation">
    <div class="modal-card tbl-detail-modal" role="dialog" aria-modal="true" aria-labelledby="tableDetailTitle">
      <div class="res-detail-hero tbl-detail-hero">
        <h3 id="tableDetailTitle" class="res-modal-title">Table</h3>
        <div id="tableDetailMeta" class="tbl-detail-meta"></div>
      </div>
      <div id="tableDetailBody" class="res-detail-body-scroll"></div>
      <div id="tableDetailActions" class="tbl-detail-actions"></div>
      <div class="res-detail-footer">
        <button type="button" class="btn btn-ghost" id="tableDetailClose">Close</button>
      </div>
    </div>
  </div>

  <div id="resDetailModal" class="modal-backdrop hidden">
    <div class="modal-card res-detail-modal">
      <div class="res-detail-hero">
        <h3 id="resDetailTitle" class="res-modal-title">Reservation</h3>
        <div id="resDetailMeta" class="res-detail-meta"></div>
      </div>
      <div id="resDetailBody" class="res-detail-body-scroll"></div>
      <div id="reschedulePanel" class="res-resched-panel hidden">
        <label class="lbl" for="resSchedLocal">New arrival (local)</label>
        <input class="inp" id="resSchedLocal" type="datetime-local" style="width:100%; margin-bottom:8px;">
        <div class="row-flex" style="gap:8px; flex-wrap:wrap;">
          <button type="button" class="btn btn-primary btn-sm" id="resSchedApply">Apply reschedule</button>
          <button type="button" class="btn btn-ghost btn-sm" id="resSchedCancel">Cancel</button>
        </div>
      </div>
      <div id="resDetailActions" class="res-action-bar row-flex" data-res-actions style="flex-wrap:wrap;"></div>
      <div class="res-detail-footer">
        <button type="button" class="btn btn-ghost" id="resDetailClose">Close</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js" crossorigin="anonymous"></script>
  <script src="/js/elite-portal-session.js"></script>
  <script src="/reception/reception-app.js?v=2"></script>
</body>
</html>
